services:
  - type: web
    name: era-of-siddhas-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER
        value: "true"
      - key: EOS_INVITE_CODE
        value: PARASHURAMA_108
    plan: free
    healthCheckPath: /api/health
