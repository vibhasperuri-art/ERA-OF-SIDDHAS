<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Lesson — Siddha Vidya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ── DEFAULT: LIGHT / PARCHMENT MODE ── */
  :root, body, body.theme-light {
    --bg-primary: #f7f2e8;
    --bg-secondary: #ede5d0;
    --bg-glass: rgba(247, 242, 232, 0.92);
    --border-glass: rgba(139, 69, 19, 0.18);
    --text-primary: #1a1208;
    --text-muted: #311e0a;
    --accent: #6f3007;
    --accent-glow: rgba(111, 48, 7, 0.12);
    --gold: #7d4e07;
    --gold-bright: #c8922a;
    --gold-dim: #7a4d0a;
    --parchment: #f7f2e8;
    --parch-mid: #d4b896;
    --parch-dim: #a07850;
    --glow: rgba(200, 146, 42, 0.15);
    --shloka-bg: rgba(111, 48, 7, 0.06);
    --shloka-border: rgba(139, 69, 19, 0.25);
    --panel-bg: rgba(237, 229, 208, 0.8);
  }
  body.theme-mystical {
    --bg-primary: #010908;
    --bg-secondary: #021816;
    --bg-glass: rgba(2, 24, 22, 0.7);
    --border-glass: rgba(46, 184, 166, 0.35);
    --text-primary: #e0fcf8;
    --text-muted: #cbf9f0;
    --accent: #2eb8a6;
    --accent-glow: rgba(46, 184, 166, 0.2);
    --gold: #2eb8a6;
    --gold-bright: #4df5e2;
    --gold-dim: #176e62;
    --parchment: #e0fcf8;
    --parch-mid: #9cf0e2;
    --parch-dim: #53c2b1;
    --glow: rgba(46, 184, 166, 0.15);
    --shloka-bg: rgba(46, 184, 166, 0.07);
    --shloka-border: rgba(46, 184, 166, 0.3);
    --panel-bg: rgba(2, 24, 22, 0.7);
  }
  body.theme-earthy {
    --bg-primary: #070402;
    --bg-secondary: #0f0a05;
    --bg-glass: rgba(15, 10, 5, 0.85);
    --border-glass: rgba(196, 137, 42, 0.2);
    --text-primary: #e8d5a3;
    --text-muted: #ebd9b5;
    --accent: #c4892a;
    --accent-glow: rgba(196, 137, 42, 0.15);
    --gold: #c4892a;
    --gold-bright: #f0c040;
    --gold-dim: #7a5415;
    --parchment: #e8d5a3;
    --parch-mid: #b89a60;
    --parch-dim: #7a6440;
    --glow: rgba(196, 137, 42, 0.15);
  }
  body.theme-fierce {
    --bg-primary: #0a0000;
    --bg-secondary: #1a0505;
    --bg-glass: rgba(26, 5, 5, 0.7);
    --border-glass: rgba(181, 42, 42, 0.3);
    --text-primary: #f4f5f6;
    --text-muted: #e4e7ea;
    --accent: #b52a2a;
    --accent-glow: rgba(255, 77, 77, 0.2);
    --gold: #b52a2a;
    --gold-bright: #ff4d4d;
    --gold-dim: #5c1414;
    --parchment: #f4f5f6;
    --parch-mid: #b0b5b9;
    --parch-dim: #7a8288;
    --glow: rgba(181, 42, 42, 0.15);
  }

  body::before {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    width: 80vmin; height: 80vmin;
    margin-top: -40vmin; margin-left: -40vmin;
    pointer-events: none;
    z-index: -1;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    opacity: 0.05;
    transition: background-image 1.5s ease-in-out;
    mix-blend-mode: screen;
    animation: slowRotate 120s linear infinite;
  }
  @keyframes slowRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  body.theme-fierce::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 5 L55 30 L85 20 L60 45 L95 50 L60 55 L85 80 L55 70 L50 95 L45 70 L15 80 L40 55 L5 50 L40 45 L15 20 L45 30 Z" fill="none" stroke="%23ff4d4d" stroke-width="0.5" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="25" fill="none" stroke="%23ff4d4d" stroke-width="0.2" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="45" fill="none" stroke="%23b52a2a" stroke-width="0.2" opacity="0.4" stroke-dasharray="1 2"/%3E%3C/svg%3E');
  }
  body.theme-earthy::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 10 Q65 40 50 50 Q35 40 50 10 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M50 90 Q65 60 50 50 Q35 60 50 90 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M10 50 Q40 65 50 50 Q40 35 10 50 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M90 50 Q60 65 50 50 Q60 35 90 50 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="30" fill="none" stroke="%23f0c040" stroke-width="0.3" opacity="0.5" stroke-dasharray="2 2"/%3E%3C/svg%3E');
  }
  body.theme-mystical::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpolygon points="50,10 90,75 10,75" fill="none" stroke="%234df5e2" stroke-width="0.5" opacity="0.6"/%3E%3Cpolygon points="50,90 90,25 10,25" fill="none" stroke="%234df5e2" stroke-width="0.5" opacity="0.6"/%3E%3Cpolygon points="50,20 80,70 20,70" fill="none" stroke="%232eb8a6" stroke-width="0.4" opacity="0.7"/%3E%3Cpolygon points="50,80 80,30 20,30" fill="none" stroke="%232eb8a6" stroke-width="0.4" opacity="0.7"/%3E%3Ccircle cx="50" cy="50" r="48" fill="none" stroke="%23176e62" stroke-width="0.3" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="5" fill="%234df5e2" opacity="0.8"/%3E%3C/svg%3E');
  }
  body.theme-light::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 5 L55 30 L85 20 L60 45 L95 50 L60 55 L85 80 L55 70 L50 95 L45 70 L15 80 L40 55 L5 50 L40 45 L15 20 L45 30 Z" fill="none" stroke="%238b4513" stroke-width="0.5" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="25" fill="none" stroke="%238b4513" stroke-width="0.2" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="45" fill="none" stroke="%238b4513" stroke-width="0.2" opacity="0.4" stroke-dasharray="1 2"/%3E%3C/svg%3E');
    mix-blend-mode: multiply !important;
    opacity: 0.12 !important;
  }

  /* Custom Cursor override */
  body.custom-cursor-active,
  body.custom-cursor-active a,
  body.custom-cursor-active button,
  body.custom-cursor-active select,
  body.custom-cursor-active input,
  body.custom-cursor-active textarea,
  body.custom-cursor-active .interactive-cell,
  body.custom-cursor-active .slider-thumb,
  body.custom-cursor-active .room-chip,
  body.custom-cursor-active .action-btn,
  body.custom-cursor-active .vastu-cell {
    cursor: none !important;
  }
  .custom-cursor {
    position: fixed;
    top: 0; left: 0;
    width: 8px; height: 8px;
    background: var(--gold-bright);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000002;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, background 0.3s;
    box-shadow: 0 0 15px 3px var(--gold-bright);
  }
  .custom-cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 44px; height: 44px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000001;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease-out, width 0.3s, height 0.3s, border-color 0.3s;
    box-shadow: inset 0 0 10px var(--glow), 0 0 10px var(--glow);
  }
  .cursor-hover .custom-cursor {
    width: 60px;
    height: 60px;
    background: var(--glow);
    backdrop-filter: blur(4px);
    box-shadow: 0 0 20px var(--gold);
  }
  .cursor-hover .custom-cursor-ring {
    width: 80px;
    height: 80px;
    border-color: var(--gold-bright);
    border-style: dotted;
    border-width: 3px;
    animation: rotateRing 3s linear infinite;
  }
  @keyframes rotateRing {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .noise-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 9998;
    opacity: 0.03;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
  }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 0;
    transition: all 0.5s ease;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .glass-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-glass);
    padding: 0.8rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-brand {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size:1.1rem;
    color: var(--gold);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn, .nav-btn:link, .nav-btn:visited {
    text-decoration: none !important;
    color: var(--text-muted) !important;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 16px;
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    transition: all 0.3s;
    background: rgba(200, 146, 42, 0.02);
    display: inline-block;
  }
  .nav-btn:hover {
    color: var(--accent) !important;
    background: var(--accent-glow) !important;
    border-color: var(--accent) !important;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .nav-btn.active {
    color: var(--text-primary) !important;
    background: var(--accent-glow) !important;
    border-color: var(--accent) !important;
    font-weight: 600;
    box-shadow: 0 0 15px var(--accent-glow);
  }
  .nav-btn.admin-tab {
    border-color: var(--gold-bright) !important;
    background: rgba(181, 42, 42, 0.05) !important;
    color: var(--gold-bright) !important;
  }
  .nav-btn.admin-tab:link, .nav-btn.admin-tab:visited {
    color: var(--gold-bright) !important;
  }
  .nav-btn.admin-tab:hover {
    background: rgba(181, 42, 42, 0.15) !important;
    border-color: var(--gold-bright) !important;
    box-shadow: 0 0 12px rgba(181, 42, 42, 0.2);
  }
  .nav-btn.admin-tab.active {
    background: rgba(181, 42, 42, 0.2) !important;
    border-color: var(--gold-bright) !important;
    box-shadow: 0 0 18px rgba(181, 42, 42, 0.3);
  }

  .theme-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    color: var(--text-muted);
    padding: 5px 10px;
    font-family: 'Outfit', sans-serif;
    font-size:0.9rem;
    border-radius: 20px;
    transition: all 0.3s;
  }
  .theme-btn:hover, .theme-btn.active {
    color: var(--text-primary);
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  /* SPLIT PANE ENGINE */
  .workspace-layout {
    display: flex;
    flex: 1;
    min-height: calc(100vh - 60px);
    flex-wrap: wrap;
  }
  .left-pane {
    flex: 0 0 100%;
    max-width: 100%;
    background: var(--bg-primary);
    padding: 2.5rem 3rem;
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    box-sizing: border-box;
  }
  .right-pane {
    display: none;
  }

  /* TEXT STYLE */
  .lesson-cat {
    font-family: 'Outfit', sans-serif;
    font-size:1.0rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }
  .lesson-title {
    font-family: 'Cinzel', serif;
    font-size:2.2rem;
    color: var(--text-primary);
    margin: 0 0 1.5rem;
    line-height: 1.2;
    border-bottom: 1px solid var(--border-glass);
    padding-bottom: 0.8rem;
  }
  .shloka-box {
    background: var(--shloka-bg);
    border-left: 3px solid var(--accent);
    padding: 1.4rem 1.6rem;
    margin: 1.5rem 0;
    border-radius: 4px;
    border: 1px solid var(--shloka-border);
    border-left-width: 3px;
  }
  .shloka-ref {
    font-family: 'Outfit', sans-serif;
    font-size:0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 0.8rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .shloka-ref::before { content: '॥'; font-size:1.02rem; }
  .shloka-ref::after  { content: '॥'; font-size:1.02rem; }
  .shloka-devanagari {
    font-family: 'Noto Serif Devanagari', serif;
    font-size:1.2rem;
    color: var(--gold-dim);
    margin-bottom: 0.5rem;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }
  .shloka-translit {
    font-family: 'EB Garamond', serif;
    font-size:1.1rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 0.5rem;
    line-height: 1.6;
  }
  .shloka-anvaya {
    font-family: 'Outfit', sans-serif;
    font-size:1.02rem;
    color: var(--accent);
    margin: 0.4rem 0 0.6rem;
    line-height: 1.6;
    padding: 0.5rem 0.8rem;
    background: var(--accent-glow);
    border-radius: 4px;
  }
  .shloka-anvaya strong { color: var(--gold-bright); }
  .shloka-translation {
    font-family: 'EB Garamond', serif;
    font-size:1.1rem;
    color: var(--text-primary);
    line-height: 1.6;
    font-style: italic;
  }
  .scientific-insight {
    background: var(--shloka-bg);
    border: 1px solid var(--border-glass);
    padding: 1.2rem 1.4rem;
    border-radius: 8px;
    margin: 1.5rem 0;
  }
  .scientific-title {
    font-family: 'Cinzel', serif;
    font-size:1.05rem;
    color: var(--gold-bright);
    margin-bottom: 0.4rem;
  }
  .scientific-text {
    font-size:1.05rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .instructions-box {
    margin-top: 1.5rem;
  }
  .instructions-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size:1.1rem;
    margin-bottom: 0.5rem;
    color: var(--text-primary);
  }
  .instructions-list {
    padding-left: 1.2rem;
    margin: 0;
  }
  .instructions-list li {
    font-size:1.05rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    line-height: 1.5;
  }

  /* PREMIUM WIDGET INTERFACES */
  .workspace-card {
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 650px;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 15px var(--glow);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    box-sizing: border-box;
  }
  .widget-title {
    font-family: 'Cinzel', serif;
    font-size:1.3rem;
    color: var(--gold-bright);
    margin-bottom: 1.2rem;
    text-align: center;
    letter-spacing: 1px;
  }

  /* CHAKRAVYUHA STYLES */
  #canvas-container {
    width: 100%;
    aspect-ratio: 1;
    max-width: 420px;
    background: #000;
    border: 1.5px solid var(--border-glass);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  #vyūha-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls-row {
    display: flex;
    gap: 10px;
    margin-top: 1.2rem;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }
  .action-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--accent);
    color: var(--text-primary);
    padding: 8px 18px;
    border-radius: 20px;
    font-family: 'Outfit', sans-serif;
    font-size:1.02rem;
    font-weight: 500;
    transition: all 0.3s;
  }
  .action-btn:hover {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .action-btn.active {
    background: var(--accent);
    border-color: var(--gold-bright);
  }

  /* SAPTANGA SLIDERS */
  .saptāṅga-dashboard {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  .saptāṅga-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .saptāṅga-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Outfit', sans-serif;
    font-size:1.02rem;
  }
  .saptāṅga-name {
    color: var(--text-primary);
    font-weight: 500;
  }
  .saptāṅga-val {
    color: var(--gold-bright);
    font-weight: 600;
  }
  .premium-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: var(--bg-secondary);
    border-radius: 3px;
    outline: none;
    border: 1px solid var(--border-glass);
  }
  .premium-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--gold-bright);
    box-shadow: 0 0 8px var(--accent);
  }

  .saptāṅga-result {
    width: 100%;
    border-top: 1px solid var(--border-glass);
    padding-top: 1.2rem;
    margin-top: 0.5rem;
    text-align: center;
  }
  .stability-score-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0.8rem auto 0;
    box-shadow: 0 0 20px var(--glow), inset 0 0 10px var(--glow);
    transition: all 0.3s;
  }
  .stability-score-circle.critical {
    border-color: #ff4d4d;
    box-shadow: 0 0 20px rgba(255,77,77,0.3);
  }
  .stability-score-circle.golden {
    border-color: #ffc837;
    box-shadow: 0 0 25px rgba(255,200,55,0.4);
  }
  .stability-num {
    font-size:1.8rem;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    color: var(--text-primary);
  }
  .stability-lbl {
    font-size:0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }
  .stability-analysis {
    font-size:1.02rem;
    color: var(--text-muted);
    margin-top: 0.8rem;
    line-height: 1.4;
    min-height: 40px;
  }

  /* VASTU PURUSHA MANDALA GRID */
  .vastu-layout-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .vastu-room-dock {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .room-chip {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size:1.0rem;
    font-family: 'Outfit', sans-serif;
    transition: all 0.3s;
  }
  .room-chip.selected {
    background: var(--accent);
    color: var(--text-primary);
    border-color: var(--gold-bright);
    box-shadow: 0 0 10px var(--glow);
  }
  .vastu-grid-wrapper {
    position: relative;
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1;
    background: var(--bg-secondary);
    border: 2px solid var(--border-glass);
    border-radius: 8px;
    overflow: hidden;
  }
  .vastu-silhouette {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    opacity: 0.08;
    pointer-events: none;
    z-index: 1;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 5 L55 25 L75 25 L60 40 L70 60 L50 48 L30 60 L40 40 L25 25 L45 25 Z" fill="%23e0fcf8"/%3E%3Ccircle cx="50" cy="50" r="45" fill="none" stroke="%23e0fcf8" stroke-dasharray="1"/%3E%3C/svg%3E');
  }
  .vastu-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    z-index: 2;
  }
  .vastu-cell {
    border: 0.5px solid rgba(46, 184, 166, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px;
    position: relative;
    box-sizing: border-box;
    transition: all 0.3s;
  }
  .cell-dir {
    font-size:0.9rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .cell-element {
    font-size:0.88rem;
    color: var(--accent);
    opacity: 0.7;
    text-align: right;
  }
  .cell-placed-room {
    font-size:0.95rem;
    font-weight: 600;
    color: var(--gold-bright);
    text-align: center;
    margin-top: 4px;
    text-shadow: 0 0 5px rgba(0,0,0,0.8);
  }
  .cell-status-dot {
    position: absolute;
    bottom: 6px; left: 6px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: transparent;
  }
  .vastu-cell.correct {
    background: rgba(46, 184, 166, 0.15);
  }
  .vastu-cell.correct .cell-status-dot {
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }
  .vastu-cell.clash {
    background: rgba(255, 77, 77, 0.15);
  }
  .vastu-cell.clash .cell-status-dot {
    background: #ff4d4d;
    box-shadow: 0 0 6px #ff4d4d;
  }
  .vastu-feedback-box {
    width: 100%;
    min-height: 60px;
    padding: 0.8rem;
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: 6px;
    font-size:1.02rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* PRANAYAMA BREATHING TRAINER */
  .pranayama-workspace {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
  }
  .breath-circle-container {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid var(--border-glass);
    background: var(--bg-secondary);
  }
  .breath-circle-glow {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--accent-glow);
    box-shadow: 0 0 30px var(--accent);
    transition: transform 0.1s ease-out, background-color 0.5s;
  }
  .breath-state-label {
    position: absolute;
    font-family: 'Cinzel', serif;
    font-size:1.4rem;
    color: var(--text-primary);
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  .breath-instructions {
    text-align: center;
    font-size:0.95rem;
    color: var(--text-muted);
    min-height: 40px;
  }
  .breath-timing-setup {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .timing-input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .timing-input-group label {
    font-size:0.95rem;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .timing-input-group input {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: 'Outfit', sans-serif;
  }

  /* VEERA MANTRA RESONANCE VISUALIZER */
  .yantra-visualizer {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 1.5rem;
  }
  .yantra-container {
    width: 220px;
    height: 220px;
    border: 1px solid var(--border-glass);
    border-radius: 50%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .yantra-svg {
    width: 90%;
    height: 90%;
    transition: transform 0.1s ease-out;
  }
  .chant-btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .resonance-meter {
    width: 100%;
    height: 4px;
    background: var(--bg-secondary);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .resonance-fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    width: 0%;
    background: var(--gold-bright);
    box-shadow: 0 0 10px var(--gold-bright);
    transition: width 0.1s ease-out;
  }

  /* GEOPOLITICAL SPHERE */
  .maṇḍala-diplomacy {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 1.5rem;
  }
  .maṇḍala-sphere-visualizer {
    width: 240px;
    height: 240px;
    position: relative;
    border: 1.5px solid var(--border-glass);
    border-radius: 50%;
    background: #000;
    overflow: hidden;
  }
  .sphere-node {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.3s;
  }
  .sphere-node.vijigishu {
    background: #ffc837;
    box-shadow: 0 0 12px #ffc837;
    width: 18px; height: 18px;
  }
  .sphere-node.ari {
    background: #ff4d4d;
    box-shadow: 0 0 10px #ff4d4d;
  }
  .sphere-node.mitra {
    background: #4df5e2;
    box-shadow: 0 0 10px #4df5e2;
  }
  .sphere-node.neutral {
    background: #8e9fa0;
    box-shadow: 0 0 6px #8e9fa0;
  }
  .diplomatic-actions-panel {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
  }

  /* EQUANIMITY CONCENTRATOR */
  .samatvam-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .samatvam-trackpad {
    width: 100%;
    height: 220px;
    background: #000;
    border: 1.5px solid var(--border-glass);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .trackpad-target {
    position: absolute;
    width: 32px; height: 32px;
    border: 2px solid var(--gold-bright);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 15px var(--gold-bright);
    transition: left 0.1s linear, top 0.1s linear;
  }
  .trackpad-pointer {
    position: absolute;
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* YAJNA FIRE ALTAR */
  .yajna-altar {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 1.2rem;
  }
  .altar-kunda {
    width: 160px;
    height: 160px;
    border: 4px solid var(--gold);
    background: var(--bg-secondary);
    transform: rotate(45deg);
    position: relative;
    box-shadow: 0 0 20px var(--glow);
    margin: 1.5rem 0;
  }
  .altar-flame {
    position: absolute;
    width: 60px; height: 60px;
    background: radial-gradient(circle, #ffae19 20%, #ff4d4d 70%, transparent 100%);
    border-radius: 50% 0 50% 50%;
    transform: rotate(-135deg) translate(-50%, -50%);
    top: 50%; left: 50%;
    filter: blur(2px);
    mix-blend-mode: screen;
    animation: flamePulse 1s infinite alternate;
  }
  @keyframes flamePulse {
    from { transform: rotate(-135deg) scale(0.95); opacity: 0.8; }
    to { transform: rotate(-135deg) scale(1.15); opacity: 1; }
  }
  .yajna-elements {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .altar-metric {
    font-size:1.0rem;
    color: var(--text-muted);
    text-align: center;
  }

  /* NEETI DILEMMA TREE */
  .neeti-card-flow {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
  }
  .neeti-question {
    font-size:0.95rem;
    color: var(--text-primary);
    line-height: 1.5;
    background: var(--bg-secondary);
    padding: 1rem;
    border-radius: 6px;
    border-left: 2px solid var(--accent);
  }
  .neeti-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .neeti-opt-btn {
    text-align: left;
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    color: var(--text-muted);
    padding: 10px 14px;
    border-radius: 6px;
    font-size:1.02rem;
    transition: all 0.3s;
    line-height: 1.4;
  }
  .neeti-opt-btn:hover {
    color: var(--text-primary);
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  .neeti-stats {
    display: flex;
    justify-content: space-around;
    border-top: 1px solid var(--border-glass);
    padding-top: 0.8rem;
    font-size:1.0rem;
  }
  .neeti-stat-val {
    color: var(--gold-bright);
    font-weight: 600;
  }

  /* DAHARA AKASHA OVERLAY */
  .dahara-overlay {
    position: relative;
    width: 100%;
    height: 250px;
    border: 1px solid var(--border-glass);
    border-radius: 8px;
    background: #000;
    overflow: hidden;
  }
  .dahara-body-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
  }
  .dahara-info-box {
    width: 100%;
    min-height: 50px;
    background: var(--bg-secondary);
    padding: 8px 12px;
    border-radius: 6px;
    font-size:1.0rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* AYADI CALCULATOR */
  .ayadi-panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    gap: 1.2rem;
  }
  .ayadi-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .ayadi-results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ayadi-result-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    padding: 8px 12px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ayadi-result-lbl {
    font-size:0.9rem;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .ayadi-result-val {
    font-size:1.1rem;
    font-weight: 600;
    color: var(--gold-bright);
  }
  .ayadi-wireframe {
    width: 100%;
    height: 120px;
    border: 1px solid var(--border-glass);
    border-radius: 6px;
    background: rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  .ayadi-canvas-wf {
    width: 100%; height: 100%;
  }

  /* LEFT PANE TAB SWITCHER */
  .pane-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-glass);
    margin-bottom: 1.5rem;
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding-top: 0.2rem;
  }
  .pane-tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size:1.02rem;
    font-weight: 500;
    padding: 10px 8px;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    position: relative;
  }
  .pane-tab-btn:hover {
    color: var(--text-primary);
    background: var(--accent-glow);
  }
  .pane-tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    text-shadow: 0 0 8px var(--accent-glow);
  }
  .pane-tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 20%;
    width: 60%;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    border-radius: 2px;
  }
  .tab-content-area {
    animation: fadeTabIn 0.35s ease-out;
  }
  @keyframes fadeTabIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SHASTRA METADATA BOX */
  .śāstra-metadata-box {
    background: linear-gradient(135deg, rgba(2, 24, 22, 0.6), rgba(2, 10, 8, 0.9));
    border: 1px solid var(--border-glass);
    border-left: 3px solid var(--gold-dim);
    padding: 1.2rem;
    border-radius: 6px;
    margin: 1.2rem 0;
  }
  .śāstra-metadata-box .meta-label {
    font-family: 'Outfit', sans-serif;
    font-size:0.9rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 0.3rem;
    font-weight: 600;
  }
  .śāstra-metadata-box .meta-value {
    font-family: 'EB Garamond', serif;
    font-size:1.1rem;
    color: var(--text-primary);
    line-height: 1.5;
  }
  .śāstra-metadata-box .meta-value em {
    color: var(--gold-bright);
    font-style: italic;
  }
  .dharmic-principles-box {
    background: rgba(46, 184, 166, 0.04);
    border: 1px solid rgba(46, 184, 166, 0.15);
    padding: 1rem 1.2rem;
    border-radius: 6px;
    margin: 1rem 0;
  }
  .dharmic-principles-box .dp-title {
    font-family: 'Cinzel', serif;
    font-size:1.02rem;
    color: var(--gold-bright);
    margin-bottom: 0.5rem;
    letter-spacing: 0.5px;
  }
  .dharmic-principles-box .dp-text {
    font-family: 'EB Garamond', serif;
    font-size:0.95rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* STEM EQUATION CARD */
  .stem-equation-card {
    background: linear-gradient(145deg, rgba(0, 0, 0, 0.5), rgba(2, 24, 22, 0.4));
    border: 1px solid rgba(46, 184, 166, 0.2);
    padding: 1.2rem;
    border-radius: 8px;
    margin: 1rem 0;
    position: relative;
    overflow: hidden;
  }
  .stem-equation-card::before {
    content: 'âˆ‘';
    position: absolute;
    top: -10px;
    right: 8px;
    font-size:4.0rem;
    color: var(--accent);
    opacity: 0.04;
    font-family: serif;
    pointer-events: none;
  }
  .stem-equation-card .eq-label {
    font-family: 'Outfit', sans-serif;
    font-size:0.9rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 0.5rem;
    font-weight: 600;
  }
  .stem-equation-card .eq-formula {
    font-family: 'EB Garamond', serif;
    font-size:1.15rem;
    color: var(--gold-bright);
    padding: 0.6rem 0.8rem;
    background: rgba(0,0,0,0.4);
    border-radius: 4px;
    border: 1px solid rgba(46, 184, 166, 0.1);
    margin: 0.5rem 0;
    letter-spacing: 0.5px;
    line-height: 1.6;
    overflow-x: auto;
  }
  .stem-equation-card .eq-explanation {
    font-size:1.05rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-top: 0.5rem;
  }
  .stem-section-title {
    font-family: 'Cinzel', serif;
    font-size:0.95rem;
    color: var(--gold-bright);
    margin: 1.5rem 0 0.5rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid rgba(46, 184, 166, 0.15);
    letter-spacing: 0.5px;
  }
  .stem-param-list {
    padding-left: 1rem;
    margin: 0.5rem 0;
  }
  .stem-param-list li {
    font-size:1.02rem;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
    line-height: 1.4;
  }
  .stem-param-list li strong {
    color: var(--text-primary);
  }

  @media (max-width: 900px) {
    .glass-nav {
      position: relative !important;
      padding: 0.75rem 1rem !important;
      flex-direction: column !important;
      gap: 0.75rem !important;
      align-items: center !important;
    }
    .glass-nav > div {
      flex-direction: row !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 10px !important;
      width: 100% !important;
      margin-left: 0 !important;
    }
    .theme-btn {
      padding: 4px 8px !important;
      font-size: 0.75rem !important;
    }
    .left-pane {
      flex: 0 0 100%;
      max-width: 100%;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--border-glass);
      padding: 1.5rem 1.5rem !important;
    }
    .right-pane {
      max-height: none;
    }
  }

  /* ── GRADE SELECTOR PILLS ── */
  .grade-selector {
    margin-bottom: 1.2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border-glass);
  }
  .grade-select-title {
    font-size:0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
  }
  .grade-pills {
    display: flex;
    gap: 6px;
    background: var(--bg-primary);
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-glass);
    overflow-x: auto;
  }
  .grade-pill-btn {
    flex: 1;
    min-width: 65px;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 4px;
    font-size:0.95rem;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    cursor: none !important;
    border-radius: 6px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .grade-pill-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.03);
  }
  .grade-pill-btn.active {
    background: var(--accent);
    color: var(--bg-primary);
    box-shadow: 0 2px 8px var(--accent-glow);
  }
  body.theme-light .grade-pill-btn.active {
    color: #fff;
  }
  .grade-pill-btn.locked {
    opacity: 0.55;
    background: rgba(0, 0, 0, 0.15) !important;
    color: var(--text-muted) !important;
    border: 1px dashed rgba(200, 146, 42, 0.2);
    cursor: not-allowed !important;
  }
  .grade-pill-btn.locked:hover {
    border-color: #ff4d4d !important;
    box-shadow: 0 0 10px rgba(255, 77, 77, 0.15) !important;
  }

  /* ── CHILD FRIENDLY STORY BOX ── */
  .story-box {
    background: rgba(200, 146, 42, 0.08);
    border-left: 3px solid var(--accent);
    padding: 1rem;
    border-radius: 0 8px 8px 0;
    margin-top: 1rem;
  }
  .story-title {
    font-family: 'Cinzel', serif;
    font-size:0.95rem;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 0.4rem;
  }
  .story-text {
    font-size:1.05rem;
    line-height: 1.5;
    color: var(--text-primary);
  }


  /* ── THEME GRAPHICS BG ── */
  .theme-graphics-bg {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: -2;
    overflow: hidden;
  }
  .graphic-element {
    position: absolute;
    opacity: 0;
    transition: opacity 1.2s ease-in-out, transform 1.5s ease-in-out;
    transform: scale(0.85) rotate(-10deg);
    color: var(--accent);
  }
  
  /* Specific Placements */
  .graphic-top-right {
    top: 8%;
    right: 5%;
    width: 25vw;
    height: 25vh;
  }
  .graphic-bottom-left {
    bottom: 8%;
    left: 4%;
    width: 25vw;
    height: 25vh;
  }

  /* Show active graphics based on theme class on body */
  body.theme-fierce .weapons-graphic {
    opacity: 0.08;
    transform: scale(1) rotate(0deg);
  }
  body.theme-earthy .manuscript-graphic {
    opacity: 0.09;
    transform: scale(1) rotate(5deg);
  }
  body.theme-mystical .yantra-graphic {
    opacity: 0.09;
    transform: scale(1) rotate(-5deg);
  }
  body.theme-light .royal-graphic {
    opacity: 0.07;
    transform: scale(1) rotate(0deg);

function isAdmin() {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get('role') === 'admin' || localStorage.getItem('eos_role') === 'admin';
}

function isGradeAuthorized(grade) {
  if (isAdmin()) {
    return true;
  }
  const gradesOrder = ['primary', 'secondary', 'ug', 'phd'];
  const userGrade = localStorage.getItem('eos_user_grade') || 'primary';
  const userGradeIdx = gradesOrder.indexOf(userGrade);
  const targetGradeIdx = gradesOrder.indexOf(grade);

  if (targetGradeIdx <= userGradeIdx) {
    return true;
  }

  if (targetGradeIdx > 0) {
    const prevGrade = gradesOrder[targetGradeIdx - 1];
    const completedGrades = JSON.parse(localStorage.getItem('era_of_siddhas_completed_grades') || '{}');
    const courseGrades = completedGrades[currentPillar]?.[currentCourse] || [];
    if (courseGrades.includes(prevGrade)) {
      return true;
    }
  }

  return false;
}

function isGradeUnlocked(grade) {
  // All grades are unlocked for preview and selectable by default
  return true;
}

function getPreviousGrade(grade) {
  const gradesOrder = ['primary', 'secondary', 'ug', 'phd'];
  const idx = gradesOrder.indexOf(grade);
  return idx > 0 ? gradesOrder[idx - 1] : null;
}

  currentGrade = grade;

function renderŚāstraContent() {
  let html = '';

  // Helper to render one shloka box
  function shlokaBox(s) {
    let box = '<div class="shloka-box">';
    if (s.ref) box += `<div class="shloka-ref">${s.ref}</div>`;
    box += `<div class="shloka-devanagari">${s.devanagari.replace(/\n/g, '<br>')}</div>`;
    
    // Primary grade hides transliteration and anvaya to avoid visual overload for children
    if (currentGrade !== 'primary') {
      box += `<div class="shloka-translit">${s.translit.replace(/\n/g, '<br>')}</div>`;
    }
    
    // Show Anvaya (Sanskrit word-by-word analysis) only for PG/PhD level
    if (s.anvaya && (currentGrade === 'ug' || currentGrade === 'phd')) {
      box += `<div class="shloka-anvaya">${s.anvaya}</div>`;
    }
    
    box += `<div class="shloka-translation"><strong>Translation:</strong> ${s.translation}</div>`;
    box += '</div>';
    return box;
  }

  // Check if current grade level is authorized
  if (!isGradeAuthorized(currentGrade)) {
    html += shlokaBox({
      ref: lesson.shloka.ref,
      devanagari: lesson.shloka.devanagari,
      translit: currentGrade === 'primary' ? "" : lesson.shloka.translit,
      translation: lesson.shloka.translation
    });
    html += getLockNoticeHtml();
    return html;
  }

  if (currentGrade === 'primary') {

/* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

function renderChakravyūha(container) {
  container.innerHTML = `
    <div class="widget-title">Chakravyūha Spiral Simulator</div>
    <div id="canvas-container">
      <canvas id="vyūha-canvas" width="400" height="400"></canvas>
    </div>
    <div class="controls-row">
      <button class="action-btn" id="vyūha-spin-btn">Pause Rotation</button>
      <button class="action-btn" id="vyūha-trace-btn">Auto-Trace Entry</button>
      <button class="action-btn" id="vyūha-lock-btn">Deploy Defensive Lock</button>
    </div>
    <div id="vyūha-feedback" style="margin-top: 1rem; font-size:1.02rem; color: var(--text-muted); text-align: center; min-height: 38px;">
      The 7 circular rings of the Chakravyūha spin in opposing directions to seal any breach points.
    </div>
  `;

  const canvas = document.getElementById('vyūha-canvas');
  const ctx = canvas.getContext('2d');
  let isSpinning = true;
  let isTracing = false;
  let isLocked = false;
  let rotationOffset = 0;
  let traceProgress = 0;

  document.getElementById('vyūha-spin-btn').addEventListener('click', (e) => {
    isSpinning = !isSpinning;
    e.target.innerText = isSpinning ? "Pause Rotation" : "Resume Rotation";
  });

  document.getElementById('vyūha-trace-btn').addEventListener('click', () => {
    isTracing = true;
    traceProgress = 0;
    document.getElementById('vyūha-feedback').innerText = "Tracing entry path... Soldiers rotate inward, shifting the entry gap and trapping the warrior.";
  });

  document.getElementById('vyūha-lock-btn').addEventListener('click', () => {
    isLocked = !isLocked;
    document.getElementById('vyūha-lock-btn').classList.toggle('active', isLocked);
    document.getElementById('vyūha-feedback').innerText = isLocked 
      ? "Defensive lock deployed! Gateways align in defensive overlap, completely sealing the maze."
      : "Standard defense active. Rings rotate in alternating directions.";
  });

  function drawVyūha() {
    ctx.clearRect(0, 0, 400, 400);
    const centerX = 200;
    const centerY = 200;
    const maxRadius = 180;
    const ringSpacing = 22;

    if (isSpinning) {
      rotationOffset += 0.005;
    }

    // Draw concentric ring walls
    for (let i = 1; i <= 7; i++) {
      const radius = i * ringSpacing + 20;
      ctx.beginPath();
      
      // Ring rotation direction alternates
      const dir = i % 2 === 0 ? 1 : -1;
      let angle = rotationOffset * dir * (1.2 - i * 0.1);
      if (isLocked) angle = 0; // Lock aligns gateways in lock mode

      // Each ring has an entry gap (opening of 40 degrees)
      const gapSize = 0.6; // radians
      const startAngle = angle;
      const endAngle = angle + (2 * Math.PI) - gapSize;

      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#2eb8a6';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw soldier dots on the walls
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--gold-bright').trim() || '#4df5e2';
      for (let s = 0; s < 360; s += 20) {
        const rad = s * Math.PI / 180;
        // Don't draw soldier in the opening gap
        const currentRelAngle = (rad - startAngle) % (2 * Math.PI);
        if (currentRelAngle > (2 * Math.PI - gapSize)) continue;

        const sx = centerX + Math.cos(rad) * radius;
        const sy = centerY + Math.sin(rad) * radius;
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    // Center Hub (Lotus formation core)
    ctx.beginPath();
    ctx.arc(centerX, centerY, 15, 0, 2 * Math.PI);
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--gold-bright').trim() || '#4df5e2';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    // Trace path
    if (isTracing) {
      traceProgress += 0.005;
      if (traceProgress > 1) traceProgress = 1;
      
      ctx.beginPath();
      ctx.moveTo(centerX, centerY + maxRadius + 30);
      
      // Draw Archimedean spiral entry path
      const totalSteps = 100 * traceProgress;
      for (let s = 0; s <= totalSteps; s++) {
        const factor = s / 100;
        const theta = factor * 7 * Math.PI;
        const currentR = maxRadius - factor * (maxRadius - 15);
        const px = centerX + Math.sin(theta) * currentR;
        const py = centerY + Math.cos(theta) * currentR + (30 * (1 - factor));
        ctx.lineTo(px, py);
      }
      ctx.strokeStyle = '#ff4d4d';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (traceProgress === 1) {
        isTracing = false;
        unlockLessonCompletion();
      }
    }

    activeAnimationFrame = requestAnimationFrame(drawVyūha);
  }

  drawVyūha();
}

    }
  }
  recalculateSaptāṅga();

      if (dir === 'Center') {
        document.getElementById('yoga-feedback').innerText = "The Center (Brahma Sthana) is sacred space. Placing furniture here blocks the energy flow of the room.";
        return;
      }

      // Remove item from previous cell
      for (const d in placements) {
        if (placements[d] === selectedItem) {
          placements[d] = null;
          document.getElementById(`yg-${d}`).innerText = "-";
          document.querySelector(`#yoga-grid-cells .vastu-cell[data-dir="${d}"]`).classList.remove('correct', 'clash');

      placements[dir] = selectedItem;

    const shoesDir = Object.keys(placements).find(k => placements[k] === "Shoes");

    if (bedDir) {
      if (correctMapping.Bed.includes(bedDir)) {
        score += 25;
      } else if (bedDir === "N") {
        feedbackText += "Bed in North: Sleeping with head to North aligns body magnetic fields against Earth's flow, causing sleep fragmentation. ";
      } else {
        feedbackText += "Bed in " + bedDir + " is sub-optimal. Sleep aligned South or Southwest for deep relaxation. ";
      }
    }

    if (deskDir) {
      if (correctMapping.Desk.includes(deskDir)) {
        score += 25;
      } else if (deskDir === "S") {
        feedbackText += "Desk in South: Studying facing South leads to sluggishness and cognitive fatigue. ";
      } else {
        feedbackText += "Desk in " + deskDir + ". Orient desk East to capture morning sunlight and stimulate focus. ";
      }
    }

    if (mirrorDir) {
      if (correctMapping.Mirror.includes(mirrorDir)) {
        score += 25;
      } else if (mirrorDir === "S") {
        feedbackText += "Mirror in South: Reflecting southern directions accumulates stressful subtle energy. ";
      } else {
        feedbackText += "Mirror in " + mirrorDir + ". Place mirrors on North/East walls to reflect morning vibrations. ";
      }
    }

    if (shoesDir) {
      if (correctMapping.Shoes.includes(shoesDir)) {
        score += 25;
      } else if (shoesDir === "NE" || shoesDir === "E") {
        feedbackText += "Shoes in " + shoesDir + ": Dirty items in pure entrance sectors clutter mental clarity. ";
      } else {
        feedbackText += "Shoes in " + shoesDir + ". Store shoes in West/Northwest quadrants. ";
      }
    }

    document.getElementById('yoga-harmony-val').innerText = score + "%";
    if (score === 100) {
      document.getElementById('yoga-feedback').innerText = "Perfect Compass Alignment! The body's biological field is fully synchronized with geomagnetic paths and solar rhythms. Highly beneficial zone for meditation and rest.";
      unlockLessonCompletion();
    } else {
      document.getElementById('yoga-feedback').innerText = feedbackText || "Arrange the furniture to see the alignment evaluation.";
    }
  }
}

function renderVastu(container) {
  container.innerHTML = `
    <div class="widget-title">Vastu Maṇḍala Room Planner</div>
    <div class="vastu-layout-area">
      <div class="vastu-room-dock" id="vastu-dock">
        <button class="room-chip selected" data-room="Kitchen">Kitchen (SE)</button>
        <button class="room-chip" data-room="Well">Well/Water (NE)</button>
        <button class="room-chip" data-room="Master Bed">Master Bed (SW)</button>
        <button class="room-chip" data-room="Treasury">Treasury (N)</button>
        <button class="room-chip" data-room="Study">Study (E)</button>
      </div>

      <div class="vastu-grid-wrapper">
        <div class="vastu-silhouette"></div>
        <div class="vastu-grid" id="vastu-grid-cells">
          <!-- 9 cells for direction-placement (3x3 grid layout) -->
          <div class="vastu-cell" data-dir="NW" data-element="Vayu (Air)">
            <span class="cell-dir">NW</span><span class="cell-element">Air</span>
            <div class="cell-placed-room" id="cell-NW">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="N" data-element="Kubera (Wealth)">
            <span class="cell-dir">N</span><span class="cell-element">Wealth</span>
            <div class="cell-placed-room" id="cell-N">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="NE" data-element="Ishanya (Water)">
            <span class="cell-dir">NE</span><span class="cell-element">Water</span>
            <div class="cell-placed-room" id="cell-NE">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="W" data-element="Varuna (Space)">
            <span class="cell-dir">W</span><span class="cell-element">Space</span>
            <div class="cell-placed-room" id="cell-W">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="Center" data-element="Brahma Sthana">
            <span class="cell-dir">Center</span><span class="cell-element">Brahma</span>
            <div class="cell-placed-room" id="cell-Center">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="E" data-element="Aditya (Sun)">
            <span class="cell-dir">E</span><span class="cell-element">Sun</span>
            <div class="cell-placed-room" id="cell-E">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="SW" data-element="Nairutya (Earth)">
            <span class="cell-dir">SW</span><span class="cell-element">Earth</span>
            <div class="cell-placed-room" id="cell-SW">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="S" data-element="Yama (Mortals)">
            <span class="cell-dir">S</span><span class="cell-element">Mortals</span>
            <div class="cell-placed-room" id="cell-S">-</div><div class="cell-status-dot"></div>
          </div>
          <div class="vastu-cell" data-dir="SE" data-element="Agni (Fire)">
            <span class="cell-dir">SE</span><span class="cell-element">Fire</span>
            <div class="cell-placed-room" id="cell-SE">-</div><div class="cell-status-dot"></div>
          </div>
        </div>
      </div>

      <div class="vastu-feedback-box" id="vastu-feedback">
        Select a room chip above, then click a grid cell to place it. Match elements for maximum thermodynamic harmony!
      </div>
      <div style="font-family:'Outfit', sans-serif; font-size:1.05rem; color: var(--gold-bright);">
        Harmony Index: <strong id="vastu-harmony-val">0%</strong>
      </div>
    </div>
  `;

  let selectedRoom = "Kitchen";
  const placements = {
    NW: null, N: null, NE: null,
    W: null, Center: null, E: null,
    SW: null, S: null, SE: null
  };

  const correctMapping = {
    "Kitchen": "SE",
    "Well": "NE",
    "Master Bed": "SW",
    "Treasury": "N",
    "Study": "E"
  };

  // Select room chip
  document.querySelectorAll('.room-chip').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.room-chip').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedRoom = btn.getAttribute('data-room');
    });
  });

  // Grid Cell Clicks
  document.querySelectorAll('.vastu-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const dir = cell.getAttribute('data-dir');
      
      // Validation rules
      if (dir === 'Center') {
        document.getElementById('vastu-feedback').innerText = "Warning: The center (Brahma Sthana) represents the ether/space core. In Vastu, this must remain open and unbuilt to allow atmospheric venting and electromagnetic currents to circulate freely.";
        return;
      }

      // Remove room from previous cell if exists
      for (const d in placements) {
        if (placements[d] === selectedRoom) {
          placements[d] = null;
          document.getElementById(`cell-${d}`).innerText = "-";
          const cellEl = document.querySelector(`.vastu-cell[data-dir="${d}"]`);
          cellEl.classList.remove('correct', 'clash');
        }
      }

      // Place in new cell
      placements[dir] = selectedRoom;
      document.getElementById(`cell-${dir}`).innerText = selectedRoom;
      
      // Update cell coloring based on correct placement
      const targetDir = correctMapping[selectedRoom];
      if (dir === targetDir) {
        cell.classList.add('correct');
        cell.classList.remove('clash');
      } else {
        cell.classList.add('clash');
        cell.classList.remove('correct');
      }

      evaluateVastuMaṇḍala();
    });
  });

  function evaluateVastuMaṇḍala() {
    let score = 0;
    let feedback = "";
    
    // Evaluate placements
    const kitchenDir = getKeyByValue(placements, "Kitchen");
    const wellDir = getKeyByValue(placements, "Well");
    const bedDir = getKeyByValue(placements, "Master Bed");
    const treasuryDir = getKeyByValue(placements, "Treasury");
    const studyDir = getKeyByValue(placements, "Study");

    // Kitchen: SE (Agni/Fire)
    if (kitchenDir === "SE") {
      score += 20;
    } else if (kitchenDir === "NE") {
      feedback += "Clash: Kitchen in Northeast mixes Fire with Water (Ishanya), causing energetic conflict. ";
    } else if (kitchenDir) {
      feedback += "Kitchen placed in " + kitchenDir + ". Not ideal. Agni (SE) optimizes infrared sanitization. ";
    }

    // Well: NE (Water)
    if (wellDir === "NE") {
      score += 20;
    } else if (wellDir === "SE") {
      feedback += "Clash: Well in Southeast places water in the fire sector. ";
    } else if (wellDir) {
      feedback += "Water source placed in " + wellDir + ". Northeastern placing harnesses optimal morning UV purification. ";
    }

    // Master Bed: SW (Earth/Nairutya)
    if (bedDir === "SW") {
      score += 20;
    } else if (bedDir) {
      feedback += "Master Bedroom in " + bedDir + ". Southwest (SW) anchor provides thermal stability during sleeping hours. ";
    }

    // Treasury: N (Kubera/Wealth)
    if (treasuryDir === "N") {
      score += 20;
    } else if (treasuryDir) {
      feedback += "Treasury placed in " + treasuryDir + ". Northern sectors represent Kubera, representing growth of wealth. ";
    }

    // Study: E (Aditya/Sun)
    if (studyDir === "E") {
      score += 20;
    } else if (studyDir) {
      feedback += "Study placed in " + studyDir + ". Eastern rays stimulate cognitive focus during study hours. ";
    }

    document.getElementById('vastu-harmony-val').innerText = score + "%";
    
    if (score === 100) {
      document.getElementById('vastu-feedback').innerText = "Perfect Alignment achieved! The thermodynamic layout balances solar radiation, wind currents, and directional elemental flow perfectly. A highly resonant space!";
      unlockLessonCompletion();
    } else {
      document.getElementById('vastu-feedback').innerText = feedback || "Place more rooms to calculate layout stability.";
    }
  }

  function getKeyByValue(object, value) {
    return Object.keys(object).find(key => object[key] === value);
  }
}

   â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function renderPranayama(container) {
  container.innerHTML = `
    <div class="widget-title">Pranayama Box Breathing Trainer</div>
    <div class="pranayama-workspace">
      <div class="breath-circle-container">
        <div class="breath-circle-glow" id="breath-glow"></div>
        <div class="breath-state-label" id="breath-state">HOLD</div>
      </div>
      <div class="breath-instructions" id="breath-inst">
        Get ready... click Start to begin Box Breathing cycle.
      </div>
      <div class="breath-timing-setup">
        <div class="timing-input-group">
          <label>Inhale (s)</label>
          <input type="number" id="br-inhale" value="4" min="2" max="10">
        </div>
        <div class="timing-input-group">
          <label>Hold (s)</label>
          <input type="number" id="br-hold1" value="4" min="2" max="10">
        </div>
        <div class="timing-input-group">
          <label>Exhale (s)</label>
          <input type="number" id="br-exhale" value="4" min="2" max="10">
        </div>
        <div class="timing-input-group">
          <label>Hold Out (s)</label>
          <input type="number" id="br-hold2" value="4" min="2" max="10">
        </div>
      </div>
      <button class="action-btn" id="breath-trigger">Start Trainer</button>
    </div>
  `;

  let breathInterval = null;
  let currentStage = 0; // 0: Inhale, 1: Hold, 2: Exhale, 3: Hold Out
  let stageTimer = 0;
  let isBreathing = false;

  const glow = document.getElementById('breath-glow');
  const label = document.getElementById('breath-state');
  const inst = document.getElementById('breath-inst');
  const trigger = document.getElementById('breath-trigger');

  trigger.addEventListener('click', () => {
    if (isBreathing) {
      clearInterval(breathInterval);
      activeIntervals = activeIntervals.filter(id => id !== breathInterval);
      trigger.innerText = "Start Trainer";
      inst.innerText = "Trainer paused.";
      label.innerText = "READY";
      glow.style.transform = "scale(1)";
      isBreathing = false;
    } else {
      isBreathing = true;
      trigger.innerText = "Stop Trainer";
      startBreathingCycle();
    }
  });

  function startBreathingCycle() {
    const inhaleTime = parseInt(document.getElementById('br-inhale').value);
    const hold1Time = parseInt(document.getElementById('br-hold1').value);
    const exhaleTime = parseInt(document.getElementById('br-exhale').value);
    const hold2Time = parseInt(document.getElementById('br-hold2').value);

    currentStage = 0;
    stageTimer = inhaleTime;
    inst.innerText = `Inhale deeply... Fill your lungs.`;
    label.innerText = "INHALE";
    glow.style.transform = "scale(2.2)";
    glow.style.transition = `transform ${inhaleTime}s linear`;

    breathInterval = setInterval(() => {
      stageTimer--;
      if (stageTimer <= 0) {
        currentStage = (currentStage + 1) % 4;
        
        if (currentStage === 0) {
          stageTimer = inhaleTime;
          label.innerText = "INHALE";
          inst.innerText = "Inhale slowly and gather focus.";
          glow.style.transition = `transform ${inhaleTime}s linear`;
          glow.style.transform = "scale(2.2)";
          unlockLessonCompletion();
        } else if (currentStage === 1) {
          stageTimer = hold1Time;
          label.innerText = "HOLD";
          inst.innerText = "Retain the breath. Suspend mental waves.";
          glow.style.transition = "none";
          glow.style.transform = "scale(2.2)";
        } else if (currentStage === 2) {
          stageTimer = exhaleTime;
          label.innerText = "EXHALE";
          inst.innerText = "Exhale slowly. Release all tension.";
          glow.style.transition = `transform ${exhaleTime}s linear`;
          glow.style.transform = "scale(0.8)";
        } else if (currentStage === 3) {
          stageTimer = hold2Time;
          label.innerText = "HOLD";
          inst.innerText = "Suspend breath outside. Experience inner space.";
          glow.style.transition = "none";
          glow.style.transform = "scale(0.8)";
        }
      }
    }, 1000);
    activeIntervals.push(breathInterval);
  }
}

function renderUpasana(container) {
  container.innerHTML = `
    <div class="widget-title">Veera Acoustic Resonance Visualizer</div>
    <div class="yantra-visualizer">
      <div class="yantra-container">
        <svg class="yantra-svg" id="y-svg" viewBox="0 0 100 100" fill="none" stroke="var(--accent)" stroke-width="0.8">
          <circle cx="50" cy="50" r="45" stroke-dasharray="1 2"/>
          <polygon points="50,10 90,75 10,75" />
          <polygon points="50,90 90,25 10,25" />
          <circle cx="50" cy="50" r="10" />
        </svg>
      </div>

      <div class="resonance-meter">
        <div class="resonance-fill" id="res-fill"></div>
      </div>

      <div class="chant-btn-grid">
        <button class="action-btn chant-seed" data-note="220" data-seed="Chest">Chest Resonance (220 Hz)</button>
        <button class="action-btn chant-seed" data-note="293" data-seed="Tracheal">Tracheal Resonance (293 Hz)</button>
        <button class="action-btn chant-seed" data-note="330" data-seed="Laryngeal">Laryngeal Resonance (330 Hz)</button>
        <button class="action-btn chant-seed" data-note="392" data-seed="Sinus">Sinus Cavity Resonance (392 Hz)</button>
      </div>
      <div style="font-size:1.02rem; color: var(--text-muted); text-align:center;">
        Click to stimulate vocal resonance parameters and check frequency alignment stability.
      </div>
    </div>
  `;

  // Web Audio Context for temple bell synthesis
  let audioCtx = null;
  let resonance = 0;
  const fill = document.getElementById('res-fill');
  const svg = document.getElementById('y-svg');

  document.querySelectorAll('.chant-seed').forEach(btn => {
    btn.addEventListener('click', () => {
      const pitch = parseFloat(btn.getAttribute('data-note'));
      triggerAudio(pitch);
      
      // Visual feedback - expand resonance meter
      resonance = Math.min(100, resonance + 25);
      fill.style.width = resonance + "%";
      
      if (resonance === 100) {
        unlockLessonCompletion();
      }
      
      // Pulse Yantra
      svg.style.transform = "scale(1.15) rotate(15deg)";
      setTimeout(() => {
        svg.style.transform = "scale(1) rotate(0deg)";
      }, 200);
    });
  });

  // Decay resonance slowly
  const decayInterval = setInterval(() => {
    resonance = Math.max(0, resonance - 2);
    fill.style.width = resonance + "%";
  }, 150);
  activeIntervals.push(decayInterval);

  function triggerAudio(frequency) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    // Temple Bell Waveform (FM synthesis or Sine mix)
    osc.type = 'sine';
    osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    
    // Add harmonic
    const overtone = audioCtx.createOscillator();
    const overtoneGain = audioCtx.createGain();
    overtone.connect(overtoneGain);
    overtoneGain.connect(audioCtx.destination);
    overtone.type = 'triangle';
    overtone.frequency.setValueAtTime(frequency * 2, audioCtx.currentTime);

    // Envelope
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
    
    overtoneGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    overtoneGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

    osc.start();
    overtone.start();

    osc.stop(audioCtx.currentTime + 1.8);
    overtone.stop(audioCtx.currentTime + 0.8);
  }
}

function renderNeeti(container) {
  const scenarios = [
    {
      q: "A severe drought strikes the southern borders. The citizens demand tax release, but the border fortification needs funding against external raiders.",
      opts: [
        { text: "Tax merchants heavily to fund border protection and relieve citizens.", j: +10, s: +20, t: -15 },
        { text: "Release taxes for citizens. Suspend border funding temporarily.", j: +25, s: -20, t: -10 },
        { text: "Keep taxes normal. Borrow resources from external allies.", j: -5, s: +10, t: +15 }
      ]
    },
    {
      q: "A high minister (Amatya) is suspected of communicating secret routes to the neighboring kingdom. Evidence is circumstantial.",
      opts: [
        { text: "Banish him immediately. Security cannot be compromised.", j: -15, s: +30, t: +5 },
        { text: "Deploy counter-espionage. feed him false intelligence.", j: +15, s: +20, t: -5 },
        { text: "Wait for concrete evidence. Do not take hasty action.", j: +25, s: -15, t: +0 }
      ]
    }
  ];

  let currentIdx = 0;
  let justice = 50;
  let security = 50;
  let treasury = 50;

  function loadDilemma() {
    if (currentIdx >= scenarios.length) {
      unlockLessonCompletion();
      container.innerHTML = `
        <div class="widget-title">Dilemma Assessment Complete</div>
        <div style="text-align:center; padding:1rem; color:var(--text-muted);">
          <p>Your leadership parameters have settled. Evaluate your final balance index below.</p>
          <div class="neeti-stats" style="margin-top: 1.5rem; font-size:1.1rem;">
            <div>Justice: <span class="neeti-stat-val">${justice}%</span></div>
            <div>Security: <span class="neeti-stat-val">${security}%</span></div>
            <div>Treasury: <span class="neeti-stat-val">${treasury}%</span></div>
          </div>
          <button class="action-btn" onclick="renderWidget()" style="margin-top:1.5rem;">Restart Simulation</button>
        </div>
      `;
      return;
    }

    const item = scenarios[currentIdx];
    container.innerHTML = `
      <div class="widget-title">Neeti Administrative Dilemma</div>
      <div class="neeti-card-flow">
        <div class="neeti-question">${item.q}</div>
        <div class="neeti-options">
          ${item.opts.map((opt, oIdx) => `
            <button class="neeti-opt-btn" data-o="${oIdx}">${opt.text}</button>
          `).join('')}
        </div>
        <div class="neeti-stats">
          <div>Justice: <span class="neeti-stat-val">${justice}%</span></div>
          <div>Security: <span class="neeti-stat-val">${security}%</span></div>
          <div>Treasury: <span class="neeti-stat-val">${treasury}%</span></div>
        </div>
      </div>
    `;

    document.querySelectorAll('.neeti-opt-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const oIdx = parseInt(btn.getAttribute('data-o'));
        const choice = item.opts[oIdx];
        
        justice = Math.min(100, Math.max(0, justice + choice.j));
        security = Math.min(100, Math.max(0, security + choice.s));
        treasury = Math.min(100, Math.max(0, treasury + choice.t));
        
        currentIdx++;
        loadDilemma();
      });
    });
  }

  loadDilemma();
}

   8. EQUANIMITY (SAMATVAM) CONCENTRATOR
   â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function renderSamatvam(container) {
  container.innerHTML = `
    <div class="widget-title">Samatvam Focus Stabilizer</div>
    <div class="samatvam-container">
      <div class="samatvam-trackpad" id="trackpad">
        <div class="trackpad-target" id="tr-target" style="top: 50%; left: 50%;"></div>
        <div class="trackpad-pointer" id="tr-pointer" style="top: 50%; left: 50%;"></div>
      </div>
      <div style="font-size:1.02rem; color:var(--text-muted); text-align:center;" id="samatvam-feedback">
        Keep the white dot centered in the drifting ring. Steady your hand.
      </div>
      <div style="font-family:'Outfit', sans-serif; font-size:1.05rem; color:var(--gold-bright);">
        Focus Integrity: <span id="samatvam-score">0%</span>
      </div>
    </div>
  `;

  const trackpad = document.getElementById('trackpad');
  const target = document.getElementById('tr-target');
  const pointer = document.getElementById('tr-pointer');
  const scoreDisplay = document.getElementById('samatvam-score');

  let targetX = 110, targetY = 110;
  let mouseX = 110, mouseY = 110;
  let angle = 0;
  let score = 0;

  // Drift the target circle programmatically
  const driftInterval = setInterval(() => {
    angle += 0.05;
    targetX = 110 + Math.sin(angle) * 70 + Math.cos(angle * 1.5) * 20;
    targetY = 110 + Math.cos(angle) * 70 + Math.sin(angle * 1.2) * 15;
    
    target.style.left = targetX + "px";
    target.style.top = targetY + "px";

    // Distance validation
    const dx = mouseX - targetX;
    const dy = mouseY - targetY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 20) {
      score = Math.min(100, score + 2);
      if (score === 100) {
        unlockLessonCompletion();
      }
    } else {
      score = Math.max(0, score - 3);
    }
    scoreDisplay.innerText = score + "%";
  }, 30);
  activeIntervals.push(driftInterval);

  trackpad.addEventListener('mousemove', (e) => {
    const rect = trackpad.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    
    pointer.style.left = mouseX + "px";
    pointer.style.top = mouseY + "px";
  });
}

function renderAyadi(container) {
  container.innerHTML = `
    <div class="widget-title">Ayadi Resonant Calculator</div>
    <div class="ayadi-panel">
      <div class="ayadi-inputs">
        <div class="timing-input-group">
          <label>Width (Hasta)</label>
          <input type="number" id="ay-width" value="12" min="2" max="100">
        </div>
        <div class="timing-input-group">
          <label>Length (Hasta)</label>
          <input type="number" id="ay-length" value="16" min="2" max="100">
        </div>
      </div>
      
      <div class="ayadi-results">
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Aya (Income)</span>
          <span class="ayadi-result-val" id="ay-res-aya">4</span>
        </div>
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Vyaya (Expense)</span>
          <span class="ayadi-result-val" id="ay-res-vyaya">6</span>
        </div>
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Yoni (Energy)</span>
          <span class="ayadi-result-val" id="ay-res-yoni">Dhvaja</span>
        </div>
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Harmony Rating</span>
          <span class="ayadi-result-val" id="ay-res-rating">Neutral</span>
        </div>
      </div>

      <div class="ayadi-wireframe">
        <canvas class="ayadi-canvas-wf" id="ay-canvas" width="300" height="120"></canvas>
      </div>
    </div>
  `;

  const inpWidth = document.getElementById('ay-width');
  const inpLength = document.getElementById('ay-length');

  inpWidth.addEventListener('input', runAyadi);
  inpLength.addEventListener('input', runAyadi);

  const canvas = document.getElementById('ay-canvas');
  const ctx = canvas.getContext('2d');

  function runAyadi() {
    const w = parseFloat(inpWidth.value) || 0;
    const l = parseFloat(inpLength.value) || 0;

    const perimeter = 2 * (w + l);

    // Ayadi Formulas
    const aya = Math.round((perimeter * 8) % 12);
    const vyaya = Math.round((perimeter * 9) % 10);
    const yoniVal = Math.round((perimeter * 3) % 8);

    const yoniLabels = ["Kaka", "Dhvaja", "Dhumra", "Simha", "Vrishabha", "Khara", "Gaja", "Vrishabha"];
    const activeYoni = yoniLabels[yoniVal] || "Dhvaja";

    document.getElementById('ay-res-aya').innerText = aya;
    document.getElementById('ay-res-vyaya').innerText = vyaya;
    document.getElementById('ay-res-yoni').innerText = activeYoni;

    const ratingEl = document.getElementById('ay-res-rating');
    if (aya > vyaya) {
      ratingEl.innerText = "Resonant";
      ratingEl.style.color = "#00ff88";
      unlockLessonCompletion();
    } else {
      ratingEl.innerText = "Conflict";
      ratingEl.style.color = "#ff4d4d";
    }

    // Draw blueprint bounding wireframe
    ctx.clearRect(0, 0, 300, 120);
    ctx.strokeStyle = aya > vyaya ? '#2eb8a6' : '#ff4d4d';
    ctx.lineWidth = 1.5;
    
    // Scale layout to fit wireframe canvas
    const scale = Math.min(200 / w, 80 / l);
    const dw = w * scale;
    const dl = l * scale;
    
    ctx.strokeRect((300 - dw)/2, (120 - dl)/2, dw, dl);
    
    // Draw crosshair axes representing energy flow
    ctx.beginPath();
    ctx.setLineDash([2, 4]);
    ctx.moveTo(150, 0); ctx.lineTo(150, 120);
    ctx.moveTo(0, 60); ctx.lineTo(300, 60);
    ctx.strokeStyle = 'rgba(46,184,166,0.3)';
    ctx.stroke();
    ctx.setLineDash([]);
  }

  runAyadi();
}

// Custom Cursor coordinates tracking
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mouseX = 0, mouseY = 0;
let ringX = 0, ringY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
});

function animateRing() {
  ringX += (mouseX - ringX) * 0.2;
  ringY += (mouseY - ringY) * 0.2;
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top = ringY + 'px';
  requestAnimationFrame(animateRing);
}

if (cursor && cursorRing) {
  document.body.classList.add('custom-cursor-active');
  animateRing();
}

function bindCursorEvents() {
  document.querySelectorAll('a, button, select, input, textarea, .tab, .course-card, .theme-btn, .interactive-cell, .slider-thumb, .room-chip, .action-btn, .vastu-cell').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
  });
}

function unlockLessonCompletion() {
  const box = document.getElementById('lesson-completion-box');
  if (box) {
    box.style.display = 'block';
    box.scrollIntoView({ behavior: 'smooth' });
  }
}

async function completeCourseLesson() {
  let completed = JSON.parse(localStorage.getItem('era_of_siddhas_completed') || '{}');
  if (!completed[currentPillar]) {
    completed[currentPillar] = [];
  }
  if (!completed[currentPillar].includes(currentCourse)) {
    completed[currentPillar].push(currentCourse);
  }
  localStorage.setItem('era_of_siddhas_completed', JSON.stringify(completed));

  // Save grade level completion to unlock the next level
  let completedGrades = JSON.parse(localStorage.getItem('era_of_siddhas_completed_grades') || '{}');
  if (!completedGrades[currentPillar]) {
    completedGrades[currentPillar] = {};
  }
  if (!completedGrades[currentPillar][currentCourse]) {
    completedGrades[currentPillar][currentCourse] = [];
  }
  if (!completedGrades[currentPillar][currentCourse].includes(currentGrade)) {
    completedGrades[currentPillar][currentCourse].push(currentGrade);
  }
  localStorage.setItem('era_of_siddhas_completed_grades', JSON.stringify(completedGrades));

  if (window.EOS_API) {
    await window.EOS_API.completeCourseLesson(currentPillar, currentCourse, currentGrade);
  }

  showCompletionModal();
}

function showCompletionModal() {
  let completed = JSON.parse(localStorage.getItem('era_of_siddhas_completed') || '{}');
  let totalCompletedCount = 0;
  for (let key in completed) {
    if (Array.isArray(completed[key])) {
      totalCompletedCount += completed[key].length;
    }
  }

  const shlokaIndex = (totalCompletedCount - 1) % samkshepaRamayanaShlokas.length;
  const selectedShloka = samkshepaRamayanaShlokas[shlokaIndex >= 0 ? shlokaIndex : 0];

  let modal = document.getElementById('completion-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'completion-modal';
    modal.style.position = 'fixed';
    modal.style.inset = '0';
