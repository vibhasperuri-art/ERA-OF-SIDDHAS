<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Lesson — Siddha Vidya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ── DEFAULT: LIGHT / PARCHMENT MODE ── */
  :root, body, body.theme-light {
    --bg-primary: #f7f2e8;
    --bg-secondary: #ede5d0;
    --bg-glass: rgba(247, 242, 232, 0.92);
    --border-glass: rgba(139, 69, 19, 0.18);
    --text-primary: #1a1208;
    --text-muted: #5c3d1a;
    --accent: #8b4513;
    --accent-glow: rgba(139, 69, 19, 0.12);
    --gold: #b8730a;
    --gold-bright: #c8922a;
    --gold-dim: #7a4d0a;
    --parchment: #f7f2e8;
    --parch-mid: #d4b896;
    --parch-dim: #a07850;
    --glow: rgba(200, 146, 42, 0.15);
    --shloka-bg: rgba(139, 69, 19, 0.06);
    --shloka-border: rgba(139, 69, 19, 0.25);
    --panel-bg: rgba(237, 229, 208, 0.8);
  }
  body.theme-mystical {
    --bg-primary: #010908;
    --bg-secondary: #021816;
    --bg-glass: rgba(2, 24, 22, 0.7);
    --border-glass: rgba(46, 184, 166, 0.35);
    --text-primary: #e0fcf8;
    --text-muted: #9cf0e2;
    --accent: #2eb8a6;
    --accent-glow: rgba(46, 184, 166, 0.2);
    --gold: #2eb8a6;
    --gold-bright: #4df5e2;
    --gold-dim: #176e62;
    --parchment: #e0fcf8;
    --parch-mid: #9cf0e2;
    --parch-dim: #53c2b1;
    --glow: rgba(46, 184, 166, 0.15);
    --shloka-bg: rgba(46, 184, 166, 0.07);
    --shloka-border: rgba(46, 184, 166, 0.3);
    --panel-bg: rgba(2, 24, 22, 0.7);
  }
  body.theme-earthy {
    --bg-primary: #070402;
    --bg-secondary: #0f0a05;
    --bg-glass: rgba(15, 10, 5, 0.85);
    --border-glass: rgba(196, 137, 42, 0.2);
    --text-primary: #e8d5a3;
    --text-muted: #b89a60;
    --accent: #c4892a;
    --accent-glow: rgba(196, 137, 42, 0.15);
    --gold: #c4892a;
    --gold-bright: #f0c040;
    --gold-dim: #7a5415;
    --parchment: #e8d5a3;
    --parch-mid: #b89a60;
    --parch-dim: #7a6440;
    --glow: rgba(196, 137, 42, 0.15);
  }
  body.theme-fierce {
    --bg-primary: #0a0000;
    --bg-secondary: #1a0505;
    --bg-glass: rgba(26, 5, 5, 0.7);
    --border-glass: rgba(181, 42, 42, 0.3);
    --text-primary: #f4f5f6;
    --text-muted: #b0b5b9;
    --accent: #b52a2a;
    --accent-glow: rgba(255, 77, 77, 0.2);
    --gold: #b52a2a;
    --gold-bright: #ff4d4d;
    --gold-dim: #5c1414;
    --parchment: #f4f5f6;
    --parch-mid: #b0b5b9;
    --parch-dim: #7a8288;
    --glow: rgba(181, 42, 42, 0.15);
  }

  body::before {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    width: 80vmin; height: 80vmin;
    margin-top: -40vmin; margin-left: -40vmin;
    pointer-events: none;
    z-index: -1;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    opacity: 0.05;
    transition: background-image 1.5s ease-in-out;
    mix-blend-mode: screen;
    animation: slowRotate 120s linear infinite;
  }
  @keyframes slowRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  body.theme-fierce::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 5 L55 30 L85 20 L60 45 L95 50 L60 55 L85 80 L55 70 L50 95 L45 70 L15 80 L40 55 L5 50 L40 45 L15 20 L45 30 Z" fill="none" stroke="%23ff4d4d" stroke-width="0.5" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="25" fill="none" stroke="%23ff4d4d" stroke-width="0.2" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="45" fill="none" stroke="%23b52a2a" stroke-width="0.2" opacity="0.4" stroke-dasharray="1 2"/%3E%3C/svg%3E');
  }
  body.theme-earthy::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 10 Q65 40 50 50 Q35 40 50 10 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M50 90 Q65 60 50 50 Q35 60 50 90 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M10 50 Q40 65 50 50 Q40 35 10 50 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M90 50 Q60 65 50 50 Q60 35 90 50 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="30" fill="none" stroke="%23f0c040" stroke-width="0.3" opacity="0.5" stroke-dasharray="2 2"/%3E%3C/svg%3E');
  }
  body.theme-mystical::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpolygon points="50,10 90,75 10,75" fill="none" stroke="%234df5e2" stroke-width="0.5" opacity="0.6"/%3E%3Cpolygon points="50,90 90,25 10,25" fill="none" stroke="%234df5e2" stroke-width="0.5" opacity="0.6"/%3E%3Cpolygon points="50,20 80,70 20,70" fill="none" stroke="%232eb8a6" stroke-width="0.4" opacity="0.7"/%3E%3Cpolygon points="50,80 80,30 20,30" fill="none" stroke="%232eb8a6" stroke-width="0.4" opacity="0.7"/%3E%3Ccircle cx="50" cy="50" r="48" fill="none" stroke="%23176e62" stroke-width="0.3" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="5" fill="%234df5e2" opacity="0.8"/%3E%3C/svg%3E');
  }

  /* Custom Cursor override */
  body.custom-cursor-active,
  body.custom-cursor-active a,
  body.custom-cursor-active button,
  body.custom-cursor-active select,
  body.custom-cursor-active input,
  body.custom-cursor-active textarea,
  body.custom-cursor-active .interactive-cell,
  body.custom-cursor-active .slider-thumb,
  body.custom-cursor-active .room-chip,
  body.custom-cursor-active .action-btn,
  body.custom-cursor-active .vastu-cell {
    cursor: none !important;
  }
  .custom-cursor {
    position: fixed;
    top: 0; left: 0;
    width: 8px; height: 8px;
    background: var(--gold-bright);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, background 0.3s;
    box-shadow: 0 0 15px 3px var(--gold-bright);
  }
  .custom-cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 44px; height: 44px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease-out, width 0.3s, height 0.3s, border-color 0.3s;
    box-shadow: inset 0 0 10px var(--glow), 0 0 10px var(--glow);
  }
  .cursor-hover .custom-cursor {
    width: 60px;
    height: 60px;
    background: var(--glow);
    backdrop-filter: blur(4px);
    box-shadow: 0 0 20px var(--gold);
  }
  .cursor-hover .custom-cursor-ring {
    width: 80px;
    height: 80px;
    border-color: var(--gold-bright);
    border-style: dotted;
    border-width: 3px;
    animation: rotateRing 3s linear infinite;
  }
  @keyframes rotateRing {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .noise-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 9998;
    opacity: 0.03;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
  }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 0;
    transition: all 0.5s ease;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .glass-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-glass);
    padding: 0.8rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-brand {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--gold);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn {
    text-decoration: none;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .nav-btn:hover {
    color: var(--text-primary);
    border-color: var(--border-glass);
    background: var(--accent-glow);
  }

  .theme-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    color: var(--text-muted);
    padding: 5px 10px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.7rem;
    border-radius: 20px;
    transition: all 0.3s;
  }
  .theme-btn:hover, .theme-btn.active {
    color: var(--text-primary);
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  /* SPLIT PANE ENGINE */
  .workspace-layout {
    display: flex;
    flex: 1;
    min-height: calc(100vh - 60px);
    flex-wrap: wrap;
  }
  .left-pane {
    flex: 0 0 55%;
    max-width: 55%;
    background: var(--bg-primary);
    border-right: 1px solid var(--border-glass);
    padding: 2.5rem 3rem;
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    box-sizing: border-box;
  }
  .right-pane {
    flex: 1;
    min-width: 300px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    box-sizing: border-box;
    position: relative;
    background: var(--bg-secondary);
  }

  /* TEXT STYLE */
  .lesson-cat {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }
  .lesson-title {
    font-family: 'Cinzel', serif;
    font-size: 2.2rem;
    color: var(--text-primary);
    margin: 0 0 1.5rem;
    line-height: 1.2;
    border-bottom: 1px solid var(--border-glass);
    padding-bottom: 0.8rem;
  }
  .shloka-box {
    background: var(--shloka-bg);
    border-left: 3px solid var(--accent);
    padding: 1.4rem 1.6rem;
    margin: 1.5rem 0;
    border-radius: 4px;
    border: 1px solid var(--shloka-border);
    border-left-width: 3px;
  }
  .shloka-ref {
    font-family: 'Outfit', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 0.8rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .shloka-ref::before { content: '॥'; font-size: 0.85rem; }
  .shloka-ref::after  { content: '॥'; font-size: 0.85rem; }
  .shloka-devanagari {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 1.2rem;
    color: var(--gold-dim);
    margin-bottom: 0.5rem;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }
  .shloka-translit {
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 0.5rem;
    line-height: 1.6;
  }
  .shloka-anvaya {
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    color: var(--accent);
    margin: 0.4rem 0 0.6rem;
    line-height: 1.6;
    padding: 0.5rem 0.8rem;
    background: var(--accent-glow);
    border-radius: 4px;
  }
  .shloka-anvaya strong { color: var(--gold-bright); }
  .shloka-translation {
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    color: var(--text-primary);
    line-height: 1.6;
    font-style: italic;
  }
  .scientific-insight {
    background: var(--shloka-bg);
    border: 1px solid var(--border-glass);
    padding: 1.2rem 1.4rem;
    border-radius: 8px;
    margin: 1.5rem 0;
  }
  .scientific-title {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    color: var(--gold-bright);
    margin-bottom: 0.4rem;
  }
  .scientific-text {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .instructions-box {
    margin-top: 1.5rem;
  }
  .instructions-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 0.5rem;
    color: var(--text-primary);
  }
  .instructions-list {
    padding-left: 1.2rem;
    margin: 0;
  }
  .instructions-list li {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    line-height: 1.5;
  }

  /* PREMIUM WIDGET INTERFACES */
  .workspace-card {
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 650px;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 15px var(--glow);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    box-sizing: border-box;
  }
  .widget-title {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: var(--gold-bright);
    margin-bottom: 1.2rem;
    text-align: center;
    letter-spacing: 1px;
  }

  /* CHAKRAVYUHA STYLES */
  #canvas-container {
    width: 100%;
    aspect-ratio: 1;
    max-width: 420px;
    background: #000;
    border: 1.5px solid var(--border-glass);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  #vyūha-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls-row {
    display: flex;
    gap: 10px;
    margin-top: 1.2rem;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }
  .action-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--accent);
    color: var(--text-primary);
    padding: 8px 18px;
    border-radius: 20px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.3s;
  }
  .action-btn:hover {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .action-btn.active {
    background: var(--accent);
    border-color: var(--gold-bright);
  }

  /* SAPTANGA SLIDERS */
  .saptāṅga-dashboard {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  .saptāṅga-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .saptāṅga-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Outfit', sans-serif;
    font-size: 0.85rem;
  }
  .saptāṅga-name {
    color: var(--text-primary);
    font-weight: 500;
  }
  .saptāṅga-val {
    color: var(--gold-bright);
    font-weight: 600;
  }
  .premium-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: var(--bg-secondary);
    border-radius: 3px;
    outline: none;
    border: 1px solid var(--border-glass);
  }
  .premium-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--gold-bright);
    box-shadow: 0 0 8px var(--accent);
  }

  .saptāṅga-result {
    width: 100%;
    border-top: 1px solid var(--border-glass);
    padding-top: 1.2rem;
    margin-top: 0.5rem;
    text-align: center;
  }
  .stability-score-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0.8rem auto 0;
    box-shadow: 0 0 20px var(--glow), inset 0 0 10px var(--glow);
    transition: all 0.3s;
  }
  .stability-score-circle.critical {
    border-color: #ff4d4d;
    box-shadow: 0 0 20px rgba(255,77,77,0.3);
  }
  .stability-score-circle.golden {
    border-color: #ffc837;
    box-shadow: 0 0 25px rgba(255,200,55,0.4);
  }
  .stability-num {
    font-size: 1.8rem;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    color: var(--text-primary);
  }
  .stability-lbl {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }
  .stability-analysis {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 0.8rem;
    line-height: 1.4;
    min-height: 40px;
  }

  /* VASTU PURUSHA MANDALA GRID */
  .vastu-layout-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .vastu-room-dock {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .room-chip {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-family: 'Outfit', sans-serif;
    transition: all 0.3s;
  }
  .room-chip.selected {
    background: var(--accent);
    color: var(--text-primary);
    border-color: var(--gold-bright);
    box-shadow: 0 0 10px var(--glow);
  }
  .vastu-grid-wrapper {
    position: relative;
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1;
    background: var(--bg-secondary);
    border: 2px solid var(--border-glass);
    border-radius: 8px;
    overflow: hidden;
  }
  .vastu-silhouette {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    opacity: 0.08;
    pointer-events: none;
    z-index: 1;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 5 L55 25 L75 25 L60 40 L70 60 L50 48 L30 60 L40 40 L25 25 L45 25 Z" fill="%23e0fcf8"/%3E%3Ccircle cx="50" cy="50" r="45" fill="none" stroke="%23e0fcf8" stroke-dasharray="1"/%3E%3C/svg%3E');
  }
  .vastu-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    z-index: 2;
  }
  .vastu-cell {
    border: 0.5px solid rgba(46, 184, 166, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px;
    position: relative;
    box-sizing: border-box;
    transition: all 0.3s;
  }
  .cell-dir {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .cell-element {
    font-size: 0.55rem;
    color: var(--accent);
    opacity: 0.7;
    text-align: right;
  }
  .cell-placed-room {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gold-bright);

const urlParams = new URLSearchParams(window.location.search);
const currentPillar = urlParams.get('pillar') || 'yuddham';
const currentCourse = urlParams.get('course') || 'vyūhas';

// Load Active Lesson with robust fallbacks
const pillarObj = lessons[currentPillar] || lessons.yuddham;
let defaultCourse = 'vyūhas';
if (currentPillar === 'rājya') defaultCourse = 'saptāṅga';
if (currentPillar === 'nagara') defaultCourse = 'vastu';

const lesson = pillarObj[currentCourse] || pillarObj[defaultCourse];

// Update Return Button Link
document.getElementById('back-to-hub-btn').href = `course_hub.html?pillar=${currentPillar}`;

// Set Theme
function setTheme(btnElement, themeName) {
  document.body.classList.remove('theme-fierce', 'theme-earthy', 'theme-mystical', 'theme-light');
  document.body.classList.add(themeName);
  localStorage.setItem('era_of_siddhas_theme', themeName);
  document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
  if (btnElement) {
    btnElement.classList.add('active');
  } else {
    document.querySelectorAll('.theme-btn').forEach(btn => {
      if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(themeName)) {
        btn.classList.add('active');
      }
    });
  }
}

// Render left pane text dynamically with tabs
let currentTab = 'śāstra';

function renderLeftPane() {
  const leftPane = document.getElementById('left-text-pane');
  leftPane.innerHTML = `
    <div class="lesson-cat">${lesson.category}</div>
    <h1 class="lesson-title">${lesson.title}</h1>

    <div class="pane-tabs">
      <button class="pane-tab-btn ${currentTab === 'śāstra' ? 'active' : ''}" id="tab-śāstra" onclick="switchLeftPaneTab('śāstra')">Śāstra Jñāna</button>
      <button class="pane-tab-btn ${currentTab === 'stem' ? 'active' : ''}" id="tab-stem" onclick="switchLeftPaneTab('stem')">STEM Science</button>
    </div>

    <div class="tab-content-area" id="tab-content-area">
      ${currentTab === 'śāstra' ? renderŚāstraContent() : renderStemContent()}
    </div>

    <div class="instructions-box" style="margin-top: 1.5rem; border-top: 1px solid var(--border-glass); padding-top: 1rem;">
      <div class="instructions-title">Lesson Instructions</div>
      <ol class="instructions-list">
        ${lesson.instructions.map(inst => `<li>${inst}</li>`).join('')}
      </ol>
    </div>
  `;
  bindCursorEvents();
}

function renderŚāstraContent() {
  let html = '';

  // Helper to render one shloka box
  function shlokaBox(s) {
    let box = '<div class="shloka-box">';
    if (s.ref) box += `<div class="shloka-ref">${s.ref}</div>`;
    box += `<div class="shloka-devanagari">${s.devanagari.replace(/\n/g, '<br>')}</div>`;
    box += `<div class="shloka-translit">${s.translit.replace(/\n/g, '<br>')}</div>`;
    if (s.anvaya) box += `<div class="shloka-anvaya">${s.anvaya}</div>`;
    box += `<div class="shloka-translation"><strong>Translation:</strong> ${s.translation}</div>`;
    box += '</div>';
    return box;
  }

  // Primary shloka
  html += shlokaBox(lesson.shloka);

  // Additional shlokas array
  if (lesson.shlokas && lesson.shlokas.length > 0) {
    html += `<div class="stem-section-title">Additional Verses from the Tradition</div>`;
    lesson.shlokas.forEach(s => { html += shlokaBox(s); });
  }

  // Historical Origin
  if (lesson.historicalOrigin) {
    const ho = lesson.historicalOrigin;
    html += `
      <div class="stem-section-title">Historical Origin</div>
      <div class="śāstra-metadata-box">
        <div class="meta-label">Source Treatise</div>
        <div class="meta-value"><em>${ho.treatise}</em></div>
      </div>
      <div class="śāstra-metadata-box">
        <div class="meta-label">Author / Tradition</div>
        <div class="meta-value">${ho.author}</div>
      </div>
      <div class="śāstra-metadata-box">
        <div class="meta-label">Period</div>
        <div class="meta-value">${ho.period}</div>
      </div>
      <div class="śāstra-metadata-box">
        <div class="meta-label">Historical Context</div>
        <div class="meta-value">${ho.context}</div>
      </div>
    `;
  }

  // Dharmic Principles
  if (lesson.dharmicPrinciples) {
    html += `
      <div class="stem-section-title">Dharmic Principles</div>
      <div class="dharmic-principles-box">
        <div class="dp-title">Philosophical Foundation</div>
        <div class="dp-text">${lesson.dharmicPrinciples}</div>
      </div>
    `;
  }
  return html;
}

function renderStemContent() {
  let html = '';
  html += `
    <div class="scientific-insight">
      <div class="scientific-title">${lesson.scientific.title}</div>
      <div class="scientific-text">${lesson.scientific.text}</div>
    </div>
  `;
  if (lesson.stemBreakdown) {
    const sb = lesson.stemBreakdown;
    html += `
      <div class="stem-section-title">Modern Discipline</div>
      <div class="śāstra-metadata-box">
        <div class="meta-label">Field of Study</div>
        <div class="meta-value"><em>${sb.discipline}</em></div>
      </div>
      <div class="stem-section-title">Core Equation</div>
      <div class="stem-equation-card">
        <div class="eq-label">Mathematical Formulation</div>
        <div class="eq-formula">${sb.equation}</div>
        <div class="eq-explanation">${sb.equationExplanation}</div>
      </div>
    `;
    if (sb.parameters && sb.parameters.length > 0) {
      html += `
        <div class="stem-section-title">System Parameters</div>
        <ul class="stem-param-list">
          ${sb.parameters.map(p => '<li>' + p + '</li>').join('')}
        </ul>
      `;
    }
    if (sb.modernCorrelation) {
      html += `
        <div class="stem-section-title">Modern Research Correlation</div>
        <div class="dharmic-principles-box">
          <div class="dp-title">Contemporary Validation</div>
          <div class="dp-text">${sb.modernCorrelation}</div>
        </div>
      `;
    }
  }
  return html;
}

// Global tracking for animation frames and intervals to prevent background leaks
let activeAnimationFrame = null;
let activeIntervals = [];

function clearActiveAnimationsAndIntervals() {
  if (activeAnimationFrame) {
    cancelAnimationFrame(activeAnimationFrame);
    activeAnimationFrame = null;
  }
  activeIntervals.forEach(intervalId => clearInterval(intervalId));
  activeIntervals = [];
}

/* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
   1. CHAKRAVYUHA SIMULATOR WIDGET
   â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function renderChakravyūha(container) {
  container.innerHTML = `
    <div class="widget-title">Chakravyūha Spiral Simulator</div>
    <div id="canvas-container">
      <canvas id="vyūha-canvas" width="400" height="400"></canvas>
    </div>
    <div class="controls-row">
      <button class="action-btn" id="vyūha-spin-btn">Pause Rotation</button>
      <button class="action-btn" id="vyūha-trace-btn">Auto-Trace Entry</button>
      <button class="action-btn" id="vyūha-lock-btn">Deploy Defensive Lock</button>
    </div>
    <div id="vyūha-feedback" style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); text-align: center; min-height: 38px;">
      The 7 circular rings of the Chakravyūha spin in opposing directions to seal any breach points.
    </div>
  `;

  const canvas = document.getElementById('vyūha-canvas');
  const ctx = canvas.getContext('2d');
  let isSpinning = true;
  let isTracing = false;
  let isLocked = false;
  let rotationOffset = 0;
  let traceProgress = 0;

  document.getElementById('vyūha-spin-btn').addEventListener('click', (e) => {
    isSpinning = !isSpinning;
    e.target.innerText = isSpinning ? "Pause Rotation" : "Resume Rotation";
  });

  document.getElementById('vyūha-trace-btn').addEventListener('click', () => {
    isTracing = true;
    traceProgress = 0;
    document.getElementById('vyūha-feedback').innerText = "Tracing entry path... Soldiers rotate inward, shifting the entry gap and trapping the warrior.";
  });

  document.getElementById('vyūha-lock-btn').addEventListener('click', () => {
    isLocked = !isLocked;
    document.getElementById('vyūha-lock-btn').classList.toggle('active', isLocked);
    document.getElementById('vyūha-feedback').innerText = isLocked 
      ? "Defensive lock deployed! Gateways align in defensive overlap, completely sealing the maze."
      : "Standard defense active. Rings rotate in alternating directions.";
  });

  function drawVyūha() {
    ctx.clearRect(0, 0, 400, 400);
    const centerX = 200;
    const centerY = 200;
    const maxRadius = 180;
    const ringSpacing = 22;

    if (isSpinning) {
      rotationOffset += 0.005;
    }

    // Draw concentric ring walls
    for (let i = 1; i <= 7; i++) {
      const radius = i * ringSpacing + 20;
      ctx.beginPath();
      
      // Ring rotation direction alternates
      const dir = i % 2 === 0 ? 1 : -1;
      let angle = rotationOffset * dir * (1.2 - i * 0.1);
      if (isLocked) angle = 0; // Lock aligns gateways in lock mode

      // Each ring has an entry gap (opening of 40 degrees)
      const gapSize = 0.6; // radians
      const startAngle = angle;
      const endAngle = angle + (2 * Math.PI) - gapSize;

      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#2eb8a6';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw soldier dots on the walls
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--gold-bright').trim() || '#4df5e2';
      for (let s = 0; s < 360; s += 20) {
        const rad = s * Math.PI / 180;
        // Don't draw soldier in the opening gap
        const currentRelAngle = (rad - startAngle) % (2 * Math.PI);
        if (currentRelAngle > (2 * Math.PI - gapSize)) continue;

        const sx = centerX + Math.cos(rad) * radius;
        const sy = centerY + Math.sin(rad) * radius;
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    // Center Hub (Lotus formation core)
    ctx.beginPath();
    ctx.arc(centerX, centerY, 15, 0, 2 * Math.PI);
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--gold-bright').trim() || '#4df5e2';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    // Trace path
    if (isTracing) {
      traceProgress += 0.005;
      if (traceProgress > 1) traceProgress = 1;
      
      ctx.beginPath();
      ctx.moveTo(centerX, centerY + maxRadius + 30);
      
      // Draw Archimedean spiral entry path
      const totalSteps = 100 * traceProgress;
      for (let s = 0; s <= totalSteps; s++) {
        const factor = s / 100;
        const theta = factor * 7 * Math.PI;
        const currentR = maxRadius - factor * (maxRadius - 15);
        const px = centerX + Math.sin(theta) * currentR;
        const py = centerY + Math.cos(theta) * currentR + (30 * (1 - factor));
        ctx.lineTo(px, py);
      }
      ctx.strokeStyle = '#ff4d4d';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (traceProgress === 1) {
        isTracing = false;
      }
    }

    activeAnimationFrame = requestAnimationFrame(drawVyūha);
  }

  drawVyūha();
}

    } else {
      analysis.innerText = "Kingdom state: Peaceful and stable. Maintain balance of resources and defense to secure borders.";
    }
  }
  recalculateSaptāṅga();
}

        document.getElementById('yoga-feedback').innerText = "The Center (Brahma Sthana) is sacred space. Placing furniture here blocks the energy flow of the room.";

      // Remove item from previous cell
      for (const d in placements) {
        if (placements[d] === selectedItem) {
          placements[d] = null;
          document.getElementById(`yg-${d}`).innerText = "-";

    let score = 0;

    const deskDir = Object.keys(placements).find(k => placements[k] === "Desk");
    const mirrorDir = Object.keys(placements).find(k => placements[k] === "Mirror");
    const shoesDir = Object.keys(placements).find(k => placements[k] === "Shoes");

    if (bedDir) {
      if (correctMapping.Bed.includes(bedDir)) {
        score += 25;
      } else if (bedDir === "N") {
        feedbackText += "Bed in North: Sleeping with head to North aligns body magnetic fields against Earth's flow, causing sleep fragmentation. ";

        feedbackText += "Bed in " + bedDir + " is sub-optimal. Sleep aligned South or Southwest for deep relaxation. ";
      }
    }

    if (deskDir) {
      if (correctMapping.Desk.includes(deskDir)) {
        score += 25;
      } else if (deskDir === "S") {
        feedbackText += "Desk in South: Studying facing South leads to sluggishness and cognitive fatigue. ";
      } else {
        feedbackText += "Desk in " + deskDir + ". Orient desk East to capture morning sunlight and stimulate focus. ";
      }
    }

    if (mirrorDir) {
      if (correctMapping.Mirror.includes(mirrorDir)) {
        score += 25;
      } else if (mirrorDir === "S") {
        feedbackText += "Mirror in South: Reflecting southern directions accumulates stressful subtle energy. ";
      } else {
        feedbackText += "Mirror in " + mirrorDir + ". Place mirrors on North/East walls to reflect morning vibrations. ";
      }
    }

    if (shoesDir) {
      if (correctMapping.Shoes.includes(shoesDir)) {
        score += 25;
      } else if (shoesDir === "NE" || shoesDir === "E") {
        feedbackText += "Shoes in " + shoesDir + ": Dirty items in pure entrance sectors clutter mental clarity. ";
      } else {
        feedbackText += "Shoes in " + shoesDir + ". Store shoes in West/Northwest quadrants. ";
      }
    }

    document.getElementById('yoga-harmony-val').innerText = score + "%";
    if (score === 100) {
      document.getElementById('yoga-feedback').innerText = "Perfect Compass Alignment! The body's biological field is fully synchronized with geomagnetic paths and solar rhythms. Highly beneficial zone for meditation and rest.";
    } else {
      document.getElementById('yoga-feedback').innerText = feedbackText || "Arrange the furniture to see the alignment evaluation.";
    }
  }

    document.getElementById('sh-status-Bathroom').style.color = bathroomOk ? "#00ff88" : "#ff4d4d";
    if (bathroomOk) totalScore += 25;

    // Cell highlight updates

    document.querySelector('#shuddhi-grid-cells [data-room="Bathroom"]').className = "vastu-cell " + (bathroomOk ? "correct" : "clash");

    document.getElementById('shuddhi-purity-val').innerText = totalScore + "%";
    
    if (totalScore === 100) {
      document.getElementById('shuddhi-feedback').innerText = "Congratulations! Bhuta Shuddhi achieved. All house sectors contain their optimal dominant elemental profiles, maximizing health, stability, and peace of mind.";
      document.getElementById('shuddhi-feedback').style.color = "#00ff88";

      document.getElementById('shuddhi-feedback').style.color = "var(--text-muted)";

  }

    if (wellDir === "NE") {
      score += 20;
    } else if (wellDir === "SE") {
      feedback += "Clash: Well in Southeast places water in the fire sector. ";
    } else if (wellDir) {
      feedback += "Water source placed in " + wellDir + ". Northeastern placing harnesses optimal morning UV purification. ";
    }

    // Master Bed: SW (Earth/Nairutya)
    if (bedDir === "SW") {
      score += 20;
    } else if (bedDir) {
      feedback += "Master Bedroom in " + bedDir + ". Southwest (SW) anchor provides thermal stability during sleeping hours. ";
    }

    // Treasury: N (Kubera/Wealth)
    if (treasuryDir === "N") {
      score += 20;
    } else if (treasuryDir) {
      feedback += "Treasury placed in " + treasuryDir + ". Northern sectors represent Kubera, representing growth of wealth. ";
    }

    // Study: E (Aditya/Sun)
    if (studyDir === "E") {
      score += 20;
    } else if (studyDir) {
      feedback += "Study placed in " + studyDir + ". Eastern rays stimulate cognitive focus during study hours. ";
    }

    document.getElementById('vastu-harmony-val').innerText = score + "%";
    
    if (score === 100) {
      document.getElementById('vastu-feedback').innerText = "Perfect Alignment achieved! The thermodynamic layout balances solar radiation, wind currents, and directional elemental flow perfectly. A highly resonant space!";
    } else {
      document.getElementById('vastu-feedback').innerText = feedback || "Place more rooms to calculate layout stability.";
    }
  }

  function getKeyByValue(object, value) {
    return Object.keys(object).find(key => object[key] === value);
  }
}

  const label = document.getElementById('breath-state');
  const inst = document.getElementById('breath-inst');
  const trigger = document.getElementById('breath-trigger');

  trigger.addEventListener('click', () => {
    if (isBreathing) {
      clearInterval(breathInterval);

      inst.innerText = "Trainer paused.";
      label.innerText = "READY";
      glow.style.transform = "scale(1)";

      stageTimer--;

        currentStage = (currentStage + 1) % 4;

          stageTimer = inhaleTime;
          label.innerText = "INHALE";

          glow.style.transition = "none";
          glow.style.transform = "scale(0.8)";

function renderUpasana(container) {
  container.innerHTML = `

          <polygon points="50,10 90,75 10,75" />
          <polygon points="50,90 90,25 10,25" />
          <circle cx="50" cy="50" r="10" />
        </svg>
      </div>

      <div class="resonance-meter">
        <div class="resonance-fill" id="res-fill"></div>
      </div>

      <div class="chant-btn-grid">
        <button class="action-btn chant-seed" data-note="220" data-seed="OM">ॐ OM</button>

        <button class="action-btn chant-seed" data-note="330" data-seed="KREEM">क्रीं KREEM</button>
        <button class="action-btn chant-seed" data-note="392" data-seed="HUM">हूं HUM</button>
      </div>
      <div style="font-size:0.85rem; color: var(--text-muted); text-align:center;">
        Click seeds to activate synthesized acoustic resonance of the mantra.
      </div>
    </div>
  `;

  // Web Audio Context for temple bell synthesis
  let audioCtx = null;
  let resonance = 0;
  const fill = document.getElementById('res-fill');
  const svg = document.getElementById('y-svg');

  document.querySelectorAll('.chant-seed').forEach(btn => {
    btn.addEventListener('click', () => {
      const pitch = parseFloat(btn.getAttribute('data-note'));
      triggerAudio(pitch);
      
      // Visual feedback - expand resonance meter
      resonance = Math.min(100, resonance + 25);
      fill.style.width = resonance + "%";
      
      // Pulse Yantra
      svg.style.transform = "scale(1.15) rotate(15deg)";
      setTimeout(() => {
        svg.style.transform = "scale(1) rotate(0deg)";
      }, 200);
    });
  });

  // Decay resonance slowly
  const decayInterval = setInterval(() => {
    resonance = Math.max(0, resonance - 2);
    fill.style.width = resonance + "%";
  }, 150);
  activeIntervals.push(decayInterval);

  function triggerAudio(frequency) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    // Temple Bell Waveform (FM synthesis or Sine mix)
    osc.type = 'sine';
    osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    
    // Add harmonic
    const overtone = audioCtx.createOscillator();
    const overtoneGain = audioCtx.createGain();
    overtone.connect(overtoneGain);
    overtoneGain.connect(audioCtx.destination);
    overtone.type = 'triangle';
    overtone.frequency.setValueAtTime(frequency * 2, audioCtx.currentTime);

    // Envelope
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
    
    overtoneGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    overtoneGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

    osc.start();
    overtone.start();

    osc.stop(audioCtx.currentTime + 1.8);
    overtone.stop(audioCtx.currentTime + 0.8);
  }
}

function renderSamatvam(container) {
  container.innerHTML = `

      <div class="samatvam-trackpad" id="trackpad">

      </div>
      <div style="font-family:'Outfit', sans-serif; font-size:0.9rem; color:var(--gold-bright);">
        Focus Integrity: <span id="samatvam-score">0%</span>
      </div>
    </div>
  `;

  const trackpad = document.getElementById('trackpad');
  const target = document.getElementById('tr-target');
  const pointer = document.getElementById('tr-pointer');
  const scoreDisplay = document.getElementById('samatvam-score');

  let targetX = 110, targetY = 110;
  let mouseX = 110, mouseY = 110;
  let angle = 0;
  let score = 0;

  // Drift the target circle programmatically
  const driftInterval = setInterval(() => {
    angle += 0.05;
    targetX = 110 + Math.sin(angle) * 70 + Math.cos(angle * 1.5) * 20;
    targetY = 110 + Math.cos(angle) * 70 + Math.sin(angle * 1.2) * 15;
    
    target.style.left = targetX + "px";
    target.style.top = targetY + "px";

    // Distance validation
    const dx = mouseX - targetX;
    const dy = mouseY - targetY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 20) {
      score = Math.min(100, score + 2);
    } else {
      score = Math.max(0, score - 3);
    }
    scoreDisplay.innerText = score + "%";
  }, 30);
  activeIntervals.push(driftInterval);

  trackpad.addEventListener('mousemove', (e) => {
    const rect = trackpad.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    
    pointer.style.left = mouseX + "px";
    pointer.style.top = mouseY + "px";
  });
}

        <circle cx="50" cy="20" r="4" class="c-node" data-ch="Sahasrara" fill="none" stroke="#fff" stroke-width="1.5"/>

        <circle cx="50" cy="45" r="3" class="c-node" data-ch="Anahata" fill="none" stroke="#4df5e2"/>
        <circle cx="50" cy="65" r="3" class="c-node" data-ch="Manipura" fill="none" stroke="#ffc837"/>
        <circle cx="50" cy="80" r="3" class="c-node" data-ch="Muladhara" fill="none" stroke="#b52a2a"/>
      </svg>
    </div>
    <div class="dahara-info-box" id="d-info">
      Hover over the chakra points on the meditation figure to reveal their corresponding space in sacred temple layouts.
    </div>
  `;

  const mapping = {
    Sahasrara: "Sahasrara (Crown Node): Aligns with the Garbhagriha (Sanctum Sanctorum) where the primary deity is anchored, maximizing acoustic resonance.",
    Ajna: "Ajna (Command Center): Corresponds to the Ardha Mandapa (antechamber), the transition point from external light to silent internal focus.",
    Anahata: "Anahata (Heart Center): Maps to the Maha Mandapa (grand gathering hall) where chanting and sacred dance occur.",
    Manipura: "Manipura (Solar Plexus): Maps to the Flagstaff (Dhwaja Stambha), stabilizing the structural alignment of the entry axis.",
    Muladhara: "Muladhara (Root Center): Aligns with the Gopuram (gateway structure), anchoring the building to the physical earth."
  };

  document.querySelectorAll('.c-node').forEach(node => {
    node.addEventListener('mouseenter', () => {
      const ch = node.getAttribute('data-ch');
      node.style.fill = getComputedStyle(document.body).getPropertyValue('--accent').trim();
      document.getElementById('d-info').innerText = mapping[ch];
    });
    node.addEventListener('mouseleave', () => {
      node.style.fill = "none";
    });
  });
}

/* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
   10. AYADI CALCULATOR WIDGET
   â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function renderAyadi(container) {
  container.innerHTML = `
    <div class="widget-title">Ayadi Resonant Calculator</div>
    <div class="ayadi-panel">
      <div class="ayadi-inputs">
        <div class="timing-input-group">
          <label>Width (Hasta)</label>
          <input type="number" id="ay-width" value="12" min="2" max="100">
        </div>
        <div class="timing-input-group">
          <label>Length (Hasta)</label>
          <input type="number" id="ay-length" value="16" min="2" max="100">
        </div>
      </div>
      
      <div class="ayadi-results">
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Aya (Income)</span>
          <span class="ayadi-result-val" id="ay-res-aya">4</span>
        </div>
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Vyaya (Expense)</span>
          <span class="ayadi-result-val" id="ay-res-vyaya">6</span>
        </div>
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Yoni (Energy)</span>
          <span class="ayadi-result-val" id="ay-res-yoni">Dhvaja</span>
        </div>
        <div class="ayadi-result-card">
          <span class="ayadi-result-lbl">Harmony Rating</span>
          <span class="ayadi-result-val" id="ay-res-rating">Neutral</span>
        </div>
      </div>

      <div class="ayadi-wireframe">
        <canvas class="ayadi-canvas-wf" id="ay-canvas" width="300" height="120"></canvas>
      </div>
    </div>
  `;

  const inpWidth = document.getElementById('ay-width');
  const inpLength = document.getElementById('ay-length');

  inpWidth.addEventListener('input', runAyadi);
  inpLength.addEventListener('input', runAyadi);

  const canvas = document.getElementById('ay-canvas');
  const ctx = canvas.getContext('2d');

  function runAyadi() {
    const w = parseFloat(inpWidth.value) || 0;
    const l = parseFloat(inpLength.value) || 0;

    const perimeter = 2 * (w + l);

    // Ayadi Formulas
    const aya = Math.round((perimeter * 8) % 12);
    const vyaya = Math.round((perimeter * 9) % 10);
    const yoniVal = Math.round((perimeter * 3) % 8);

    const yoniLabels = ["Kaka", "Dhvaja", "Dhumra", "Simha", "Vrishabha", "Khara", "Gaja", "Vrishabha"];
    const activeYoni = yoniLabels[yoniVal] || "Dhvaja";

    document.getElementById('ay-res-aya').innerText = aya;
    document.getElementById('ay-res-vyaya').innerText = vyaya;
    document.getElementById('ay-res-yoni').innerText = activeYoni;

    const ratingEl = document.getElementById('ay-res-rating');
    if (aya > vyaya) {
      ratingEl.innerText = "Resonant";
      ratingEl.style.color = "#00ff88";
    } else {
      ratingEl.innerText = "Conflict";
      ratingEl.style.color = "#ff4d4d";
    }

    // Draw blueprint bounding wireframe
    ctx.clearRect(0, 0, 300, 120);
    ctx.strokeStyle = aya > vyaya ? '#2eb8a6' : '#ff4d4d';
    ctx.lineWidth = 1.5;
    
    // Scale layout to fit wireframe canvas
    const scale = Math.min(200 / w, 80 / l);
    const dw = w * scale;
    const dl = l * scale;
    
    ctx.strokeRect((300 - dw)/2, (120 - dl)/2, dw, dl);
    
    // Draw crosshair axes representing energy flow
    ctx.beginPath();
    ctx.setLineDash([2, 4]);
    ctx.moveTo(150, 0); ctx.lineTo(150, 120);
    ctx.moveTo(0, 60); ctx.lineTo(300, 60);
    ctx.strokeStyle = 'rgba(46,184,166,0.3)';
    ctx.stroke();
    ctx.setLineDash([]);
  }

  runAyadi();
}

document.addEventListener('DOMContentLoaded', () => {
  renderLeftPane();
  renderWidget();

  const initialTheme = localStorage.getItem('era_of_siddhas_theme') || 'theme-mystical';
  setTheme(null, initialTheme);

// Custom Cursor coordinates tracking
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mouseX = 0, mouseY = 0;
let ringX = 0, ringY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
});

function animateRing() {
  ringX += (mouseX - ringX) * 0.2;
  ringY += (mouseY - ringY) * 0.2;
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top = ringY + 'px';
  requestAnimationFrame(animateRing);
}

if (cursor && cursorRing) {
  document.body.classList.add('custom-cursor-active');
  animateRing();
}

function bindCursorEvents() {
  document.querySelectorAll('a, button, select, input, textarea, .tab, .course-card, .theme-btn, .interactive-cell, .slider-thumb, .room-chip, .action-btn, .vastu-cell').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
  });
}
