function calculateSolveEquation() {
  const box = document.getElementById('solver-results-box');
  const explanation = document.getElementById('solver-explanation');
  if (!box || !explanation) return;
  
  const in1 = parseFloat(document.getElementById('eq-in-1')?.value) || 0;
  const in2 = parseFloat(document.getElementById('eq-in-2')?.value) || 0;
  const in3 = parseFloat(document.getElementById('eq-in-3')?.value) || 0;
  const in4 = parseFloat(document.getElementById('eq-in-4')?.value) || 0;
  
  let sol = '';
  
  // Yuddha Yoga Box Breathing
  if (currentCourse === 'yoga' && currentPillar === 'yuddham') {
    const t_exhale = in1;
    const t_inhale = in2;
    const t_hold_in = in3;
    const t_hold_out = in4;
    const denom = t_inhale + t_hold_in + t_hold_out;
    const ratio = denom > 0 ? (t_exhale / denom).toFixed(3) : 0;
    const pct = Math.round(ratio * 100);
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Identify variables: Exhale time = ${t_exhale}s, rest of cycle = Inhale (${t_inhale}s) + Hold (${t_hold_in}s) + Hold Out (${t_hold_out}s) = ${denom}s.<br>
        <strong>Step 2:</strong> Divide Exhale by rest of cycle: ${t_exhale} ÷ ${denom} = <strong>${ratio}</strong>.<br>
        <strong>Step 3:</strong> Vagal activation rating: <strong>${pct}%</strong>. Longer exhales stimulate your vagus nerve to calm your body down!
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Calculate non-exhalatory duration sum: $t_{inhale} + t_{hold-in} + t_{hold-out} = ${t_inhale} + ${t_hold_in} + ${t_hold_out} = ${denom}$ seconds.<br>
        2. Calculate ratio: $\\Phi = \\frac{t_{exhale}}{T_{non-exhale}} = \\frac{${t_exhale}}{${denom}} = <strong>${ratio}</strong>$.<br>
        3. <strong>Vagal Coherence factor:</strong> Parasympathetic feedback frequency increases proportional to $\\Phi$ (${pct}% vagus activation). Long exhalations trigger baroreflex adjustments, lowering Heart Rate and boosting cognitive focus under stress.
      `;
    }
  }
  // Yuddha Upasana sound resonance
  else if (currentCourse === 'upasana' && currentPillar === 'yuddham') {
    const n = in1;
    const L = in2;
    const v = 343;
    const f = (n * v) / (2 * L);
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Identify constants: Speed of sound ($v$) = 343 m/s.<br>
        <strong>Step 2:</strong> Numerator: Harmonic (${n}) × Speed = ${n} × 343 = ${n * v}.<br>
        <strong>Step 3:</strong> Denominator: 2 × Cavity Length (${L}m) = ${(2 * L).toFixed(2)}m.<br>
        <strong>Step 4:</strong> Frequency: ${n * v} ÷ ${(2 * L).toFixed(2)} = <strong>${Math.round(f)} Hz</strong>. This pitch creates a physical echo inside your throat!
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Formula: $f_n = \\frac{n \\cdot v}{2L}$ where $v = 343\\text{ m/s}$ and $L = ${L}\\text{ m}$.<br>
        2. Substitute values: $f_{${n}} = \\frac{${n} \\times 343}{2 \\times ${L}} = \\frac{${n * v}}{${(2 * L).toFixed(3)}}$.<br>
        3. Result: $f_{${n}} = \\mathbf{${f.toFixed(2)}\\text{ Hz}}$ (cycles per second).<br>
        At this resonant frequency, the sound waves superimpose constructively inside the oral-nasal cavity, generating acoustic standing waves that vibrate the cranial floor and stimulate laryngeal vagus receptors.
      `;
    }
  }
  // Mandala states circle
  else if (currentCourse === 'maṇḍala' && currentPillar === 'yuddham') {
    const k = in1;
    const d = in2;
    const H = in3;
    const val = (k / d) - 0.5 * H;
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Divide Trade Connectivity (${k}) by Distance (${d}): ${k} ÷ ${d} = ${k/d}.<br>
        <strong>Step 2:</strong> Multiply Hostility (${H}) by weight 0.5: 0.5 × ${H} = ${0.5*H}.<br>
        <strong>Step 3:</strong> Alliance Strength: ${k/d} - ${0.5*H} = <strong>${val.toFixed(2)}</strong>.<br>
        *Note: If strength is positive, states are allies. If negative, they are in conflict!
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Formula: $A_{ij} = \\frac{k_{trade}}{d_{ij}} - \\alpha \\cdot H_{ij}$ using conflict memory index $\\alpha = 0.5$.<br>
        2. Substitute values: $A_{ij} = \\frac{${k}}{${d}} - 0.5 \\times ${H}$.<br>
        3. Calculate terms: $A_{ij} = ${k/d} - ${0.5*H} = <strong>${val.toFixed(3)}</strong>$.<br>
        <strong>Geopolitical assessment:</strong> A value of $A_{ij} = ${val.toFixed(3)}$ indicates ${val > 0 ? "stable alliance integration (Mitra)" : "adversarial containment stress (Ari)"}. Geopolitical friction is minimized when trade pathways dominate territorial proximity.
      `;
    }
  }
  // Chakravyuha Archimedean spiral
  else if (currentCourse === 'vyūhas' && currentPillar === 'yuddham') {
    const a = in1;
    const b = in2;
    const theta = in3;
    const r = a + b * theta;
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Multiply Spacing (${b}) by Angle theta in radians (${theta}): ${b} × ${theta} = ${(b * theta).toFixed(2)}.<br>
        <strong>Step 2:</strong> Add Base Center offset (${a}): ${a} + ${(b * theta).toFixed(2)} = <strong>${r.toFixed(2)} Hasta</strong>.<br>
        This gives the physical distance from the center for the gateway of the spiral at that angle.
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Archimedean spiral: $r(\\theta) = a + b\\theta$ where $a = ${a}$ and $b = ${b}$.<br>
        2. Substitute $\\theta = ${theta}$ rad:<br>
           $r(${theta}) = ${a} + ${b} \\times ${theta} = ${a} + ${(b * theta).toFixed(3)} = <strong>${r.toFixed(3)} \\text{ Hasta}</strong>$.<br>
        In Cartesian coordinates, this matches point: $x = r\\cos(${theta}) = ${(r*Math.cos(theta)).toFixed(2)}$, $y = r\\sin(${theta}) = ${(r*Math.sin(theta)).toFixed(2)}$.
      `;
    }
  }
  // Saptanga Heptagonal average
  else if (currentCourse === 'saptāṅga' && currentPillar === 'rājya') {
    const mu = in1;
    const v = in2;
    const s = mu - 0.1 * v;
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Multiply Variance (${v}) by factor 0.1: 0.1 × ${v} = ${0.1*v}.<br>
        <strong>Step 2:</strong> Subtract from Mean Value (${mu}): ${mu} - ${0.1*v} = <strong>${s.toFixed(1)}%</strong> stability.<br>
        Large differences between limbs reduce state stability rapidly, even if the overall scores are high!
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Formulate stability: $S_{state} = \\mu_{limbs} - \\beta \\cdot \\text{Var}(x)$ where $\\beta = 0.1$.<br>
        2. Substitute values: $S = ${mu} - 0.1 \\times ${v}$.<br>
        3. Result: $S = <strong>${s.toFixed(2)}\\%</strong>$.<br>
        This models Kautilya's Saptanga: a state with high resource variance (e.g. powerful military but bankrupt treasury) experiences localized strain, penalizing the baseline stability index by ${0.1*v} units.
      `;
    }
  }
  // Samatvam concentration
  else if (currentCourse === 'yoga' && currentPillar === 'rājya') {
    const pfc = in1;
    const amy = in2;
    const noise = in3;
    const C = pfc / (amy + 0.1 * noise * noise);
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Square noise: ${noise} × ${noise} = ${noise*noise}.<br>
        <strong>Step 2:</strong> Multiply by weight 0.1: 0.1 × ${noise*noise} = ${(0.1*noise*noise).toFixed(1)}.<br>
        <strong>Step 3:</strong> Add Amygdala activity (${amy}): ${amy} + ${(0.1*noise*noise).toFixed(1)} = ${(amy + 0.1*noise*noise).toFixed(1)}.<br>
        <strong>Step 4:</strong> Divide PFC focus (${pfc}): ${pfc} ÷ ${(amy + 0.1*noise*noise).toFixed(1)} = <strong>${C.toFixed(3)}</strong> focus rating.
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Formulation: $C_{focus} = \\frac{S_{PFC}}{S_{amygdala} + \\beta \\cdot \\sigma_{ext}^2}$ where $\\beta = 0.1$.<br>
        2. Substitute inputs: $C = \\frac{${pfc}}{${amy} + 0.1 \\times ${noise}^2} = \\frac{${pfc}}{${amy} + 0.1 \\times ${noise*noise}} = \\frac{${pfc}}{${(amy + 0.1*noise*noise).toFixed(3)}}$.<br>
        3. Focus Coefficient ($C$): <strong>${C.toFixed(4)}</strong>.<br>
        Higher values represent a brain that keeps cognitive focus locked despite external stress and emotional drift.
      `;
    }
  }
  // Yajna Ecology rain
  else if (currentCourse === 'upasana' && currentPillar === 'rājya') {
    const T = in1;
    const N = in2;
    const rate = 0.2 * T - 0.001 * N * N;
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Multiply Temp (${T}) by 0.2: 0.2 × ${T} = ${0.2*T}.<br>
        <strong>Step 2:</strong> Square aerosols concentration: ${N} × ${N} = ${N*N}. Multiply by 0.001 = ${(0.001*N*N).toFixed(2)}.<br>
        <strong>Step 3:</strong> Net rain-seeding rate: ${0.2*T} - ${(0.001*N*N).toFixed(2)} = <strong>${rate.toFixed(2)} particles/s</strong>.
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Seeding rate differential: $\\frac{dN}{dt} = \\beta \\cdot T_{combustion} - \\alpha \\cdot N^2$ with $\\beta = 0.2$ and $\\alpha = 0.001$.<br>
        2. Substitute: $\\frac{dN}{dt} = 0.2 \\times ${T} - 0.001 \\times ${N}^2 = ${0.2*T} - ${(0.001*N*N).toFixed(3)}$.<br>
        3. Solution: $\\frac{dN}{dt} = <strong>${rate.toFixed(3)}\\text{ ppm/s}</strong>$.<br>
        Optimal cloud droplet formation requires a stable balance: overheating vaporizes herbal oils into simple carbon ash, reducing net seeding aerosols (represented by the quadratic loss term).
      `;
    }
  }
  // Neeti administrative policy utility
  else if (currentCourse === 'neeti' && currentPillar === 'rājya') {
    const w1 = in1;
    const w2 = in2;
    const w3 = in3;
    const sum_w = w1 + w2 + w3;
    const u = w1 * 80 + w2 * 70 + w3 * 60;
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Check weights sum: ${w1} + ${w2} + ${w3} = ${sum_w.toFixed(2)}.<br>
        <strong>Step 2:</strong> Multiply weights by values (Justice=80, Security=70, Treasury=60):<br>
        (${w1} × 80) + (${w2} × 70) + (${w3} × 60) = ${w1*80} + ${w2*70} + ${w3*60}.<br>
        <strong>Step 3:</strong> Sum: <strong>${u.toFixed(1)}</strong> utility points.
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        Using the Multi-Criteria Utility formulation $U(a) = \\sum_{i} w_i v_i(a)$ where $v = [80, 70, 60]^T$:<br>
        1. Dot product calculation: $U(a) = ${w1} \\times 80 + ${w2} \\times 70 + ${w3} \\times 60$.<br>
        2. Solve: $U(a) = ${w1*80} + ${w2*70} + ${w3*60} = <strong>${u.toFixed(2)}</strong>$.<br>
        If the normalized weights sum to $${sum_w.toFixed(3)}$, the policy action is rated as ${u > 70 ? "optimal" : "sub-optimal"}.
      `;
    }
  }
  // Vastu Purusha Mandala expansion
  else if (currentCourse === 'vastu' && currentPillar === 'nagara') {
    const R0 = in1;
    const n = in2;
    const phi = 1.618;
    const Rn = R0 * Math.pow(phi, n);
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Take Golden Ratio (1.618) to the power of ring (${n}): 1.618^${n} = ${(Math.pow(phi, n)).toFixed(3)}.<br>
        <strong>Step 2:</strong> Multiply by core radius (${R0} Hasta): ${R0} × ${(Math.pow(phi, n)).toFixed(3)} = <strong>${Rn.toFixed(2)} Hasta</strong>.<br>
        This is the radius of the outer city boundary for that zone ring.
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Golden ratio expansion model: $R_n = R_0 \\cdot \\phi^n$ where $\\phi = 1.618$ and $R_0 = ${R0}$.<br>
        2. Calculate expansion scale factor: $\\phi^{${n}} = 1.618^{${n}} = ${(Math.pow(phi, n)).toFixed(4)}$.<br>
        3. Boundary Radius ($R_{${n}}$): $${R0} \\times ${(Math.pow(phi, n)).toFixed(4)} = \\mathbf{${Rn.toFixed(3)}\\text{ Hasta}}$.<br>
        This logarithmic spacing distributes building stress and wind currents in fractal proportions, mirroring plant phyllotaxis structures.
      `;
    }
  }
  // Compass layout fractal dimension
  else if (currentCourse === 'yoga' && currentPillar === 'nagara') {
    const r = in1;
    const N = in2;
    const D = Math.log(N) / Math.log(1 / r);
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Find inverse scale factor: 1 ÷ ${r} = ${1/r}.<br>
        <strong>Step 2:</strong> Calculate logs: log(${N}) = ${(Math.log(N)).toFixed(3)}, log(${1/r}) = ${(Math.log(1/r)).toFixed(3)}.<br>
        <strong>Step 3:</strong> Divide: ${(Math.log(N)).toFixed(3)} ÷ ${(Math.log(1/r)).toFixed(3)} = <strong>${D.toFixed(3)}</strong>.<br>
        A fractal dimension around 1.4 is naturally pleasing to the human eye!
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Fractal dimension formula: $D_f = \\frac{\\log(N)}{\\log(1/r)}$ with scale factor $r = ${r}$, pieces $N = ${N}$.<br>
        2. Substitute values: $D_f = \\frac{\\log(${N})}{\\log(${1/r})} = \\frac{${(Math.log(N)).toFixed(4)}}{${(Math.log(1/r)).toFixed(4)}}$.<br>
        3. Solution: $D_f = <strong>${D.toFixed(4)}</strong>$.<br>
        A dimension of $D_f = ${D.toFixed(3)}$ sits in the optimal human awe-induction range (1.3 - 1.5), which is mathematically replicated in the temple shikharas.
      `;
    }
  }
  // Bhuta Shuddhi solar access
  else if (currentCourse === 'upasana' && currentPillar === 'nagara') {
    const H = in1;
    const W = in2;
    const angle = Math.atan(H / W) * (180 / Math.PI);
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Divide building height (${H}) by street width (${W}): ${H} ÷ ${W} = ${(H/W).toFixed(3)}.<br>
        <strong>Step 2:</strong> Take the arctan of this value: arctan(${(H/W).toFixed(3)}) = <strong>${angle.toFixed(1)} degrees</strong>.<br>
        This is the minimum height angle the sun must be to reach the street floor!
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Solar access street aspect angle: $\\theta = \\arctan\\left(\\frac{H}{W}\\right)$ for height $H = ${H}$, width $W = ${W}$.<br>
        2. Evaluate ratio: $\\frac{H}{W} = ${(H/W).toFixed(4)}$.<br>
        3. Angle: $\\theta = \\arctan(${(H/W).toFixed(4)}) = ${(Math.atan(H/W)).toFixed(4)}\\text{ rad} = <strong>${angle.toFixed(2)}^\\circ</strong>$.<br>
        If street height exceeds width heavily, winter solar penetration is blocked. This matches the passive microclimate rules defined in the Shilpashastras.
      `;
    }
  }
  // Upanishad Dahara Akasha room modes
  else if (currentCourse === 'upanishads' && currentPillar === 'nagara') {
    const L = in1;
    const W = in2;
    const idxText = document.getElementById('eq-in-3')?.value || '1, 1';
    const parts = idxText.split(',').map(Number);
    const p = parts[0] || 1;
    const q = parts[1] || 1;
    
    const val = Math.sqrt(Math.pow(p/L, 2) + Math.pow(q/W, 2));
    const f = (343 / 2) * val;
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Calculate lengths modal ratios: (${p}/${L})^2 = ${(Math.pow(p/L, 2)).toFixed(5)}.<br>
        <strong>Step 2:</strong> Calculate widths modal ratios: (${q}/${W})^2 = ${(Math.pow(q/W, 2)).toFixed(5)}.<br>
        <strong>Step 3:</strong> Sum ratios: ${(Math.pow(p/L, 2) + Math.pow(q/W, 2)).toFixed(5)}.<br>
        <strong>Step 4:</strong> Take square root: ${val.toFixed(4)}.<br>
        <strong>Step 5:</strong> Multiply by sound speed constant (171.5): 171.5 × ${val.toFixed(4)} = <strong>${Math.round(f)} Hz</strong>.
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        Using the 2D room mode wave equation $f_{pq} = \\frac{c}{2} \\sqrt{\\left(\\frac{p}{L}\\right)^2 + \\left(\\frac{q}{W}\\right)^2}$ with $c = 343\\text{ m/s}$:<br>
        1. Substitute mode indices $(p,q) = (${p},${q})$, dimensions $L = ${L}\\text{ m}, W = ${W}\\text{ m}$.<br>
        2. Calculate modal vectors: $\\sqrt{\\left(\\frac{${p}}{${L}}\\right)^2 + \\left(\\frac{${q}}{${W}}\\right)^2} = \\sqrt{${(Math.pow(p/L,2)).toFixed(5)} + ${(Math.pow(q/W,2)).toFixed(5)}} = ${val.toFixed(4)}$.<br>
        3. Frequency: $f_{${p}${q}} = 171.5 \\times ${val.toFixed(4)} = \\mathbf{${f.toFixed(2)}\\text{ Hz}}$.<br>
        This frequency represents a natural acoustic node in the room, where pressure waves form peaks or valleys.
      `;
    }
  }
  // Sthapatya Ayadi math
  else if (currentCourse === 'sthapatya' && currentPillar === 'nagara') {
    const P = in1;
    const aya = (P * 8) % 12;
    const vyaya = (P * 9) % 10;
    const yoni = (P * 3) % 8;
    
    if (currentGrade === 'secondary') {
      sol = `
        <strong>Step 1:</strong> Calculate Income (Aya): (${P} × 8) mod 12 = ${P * 8} mod 12 = <strong>${aya}</strong>.<br>
        <strong>Step 2:</strong> Calculate Expense (Vyaya): (${P} × 9) mod 10 = ${P * 9} mod 10 = <strong>${vyaya}</strong>.<br>
        <strong>Step 3:</strong> Calculate Energy (Yoni): (${P} × 3) mod 8 = ${P * 3} mod 8 = <strong>${yoni}</strong>.<br>
        *Rule: A building is auspicious if Income (${aya}) is greater than Expense (${vyaya})!
      `;
    } else {
      sol = `
        <strong>Mathematical Resolution:</strong><br>
        1. Aya congruence: $Aya = (P \\cdot 8) \\pmod{12} = (${P} \\times 8) \\pmod{12} = ${P * 8} \\pmod{12} = <strong>${aya}</strong>$.<br>
        2. Vyaya congruence: $Vyaya = (P \\cdot 9) \\pmod{10} = (${P} \\times 9) \\pmod{10} = ${P * 9} \\pmod{10} = <strong>${vyaya}</strong>$.<br>
        3. Yoni congruence: $Yoni = (P \\cdot 3) \\pmod{8} = (${P} \\times 3) \\pmod{8} = ${P * 3} \\pmod{8} = <strong>${yoni}</strong>$.<br>
        <strong>Acoustic resonance validation:</strong> Since $Aya (${aya}) ${aya > vyaya ? ">" : "\\le"} Vyaya (${vyaya})$, this perimeter is rated as ${aya > vyaya ? "Resonant" : "Inharmonious"}. Modular sieves align room geometry to avoid modal packing clusters.
      `;
    }
  }
  
  box.style.display = 'block';
  explanation.innerHTML = sol;
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([explanation]).catch((err) => console.log(err));
  }
}

function closeCompletionModal() {
  const modal = document.getElementById('completion-modal');
  if (modal) {
    modal.style.display = 'none';
  }
  window.location.href = `course_hub.html?pillar=${currentPillar}`;
}
