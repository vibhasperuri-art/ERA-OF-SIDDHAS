<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuddham Course Hub — Era of Siddhas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="js/api.js"></script>
<style>
  :root, body.theme-mystical {
    --bg-primary: #010908;
    --bg-secondary: #021816;
    --bg-glass: rgba(2, 24, 22, 0.7);
    --border-glass: rgba(46, 184, 166, 0.35);
    --text-primary: #e0fcf8;
    --text-muted: #cbf9f0;
    --accent: #2eb8a6;
    --accent-glow: rgba(46, 184, 166, 0.2);
    --gold: #2eb8a6;
    --gold-bright: #4df5e2;
    --gold-dim: #176e62;
    --parchment: #e0fcf8;
    --parch-mid: #9cf0e2;
    --parch-dim: #53c2b1;
    --glow: rgba(46, 184, 166, 0.15);
  }
  body.theme-light {
    --bg-primary: #f7f2e8;
    --bg-secondary: #ede5d0;
    --bg-glass: rgba(247, 242, 232, 0.92);
    --border-glass: rgba(139, 69, 19, 0.18);
    --text-primary: #1a1208;
    --text-muted: #311e0a;
    --accent: #6f3007;
    --accent-glow: rgba(111, 48, 7, 0.12);
    --gold: #7d4e07;
    --gold-bright: #c8922a;
    --gold-dim: #7a4d0a;
    --parchment: #f7f2e8;
    --parch-mid: #d4b896;
    --parch-dim: #a07850;
    --glow: rgba(200, 146, 42, 0.15);
  }
  body.theme-earthy {
    --bg-primary: #070402;
    --bg-secondary: #0f0a05;
    --bg-glass: rgba(15, 10, 5, 0.85);
    --border-glass: rgba(196, 137, 42, 0.2);
    --text-primary: #e8d5a3;
    --text-muted: #ebd9b5;
    --accent: #c4892a;
    --accent-glow: rgba(196, 137, 42, 0.15);
    --gold: #c4892a;
    --gold-bright: #f0c040;
    --gold-dim: #7a5415;
    --parchment: #e8d5a3;
    --parch-mid: #b89a60;
    --parch-dim: #7a6440;
    --glow: rgba(196, 137, 42, 0.15);
  }
  body.theme-fierce {
    --bg-primary: #0a0000;
    --bg-secondary: #1a0505;
    --bg-glass: rgba(26, 5, 5, 0.7);
    --border-glass: rgba(181, 42, 42, 0.3);
    --text-primary: #f4f5f6;
    --text-muted: #e4e7ea;
    --accent: #b52a2a;
    --accent-glow: rgba(255, 77, 77, 0.2);
    --gold: #b52a2a;
    --gold-bright: #ff4d4d;
    --gold-dim: #5c1414;
    --parchment: #f4f5f6;
    --parch-mid: #b0b5b9;
    --parch-dim: #7a8288;
    --glow: rgba(181, 42, 42, 0.15);
  }

  .theme-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    color: var(--text-muted);
    padding: 6px 12px;
    font-family: 'Outfit', sans-serif;
    font-size:0.95rem;
    cursor: none !important;
    transition: all 0.3s;
    border-radius: 40px;
  }
  .theme-btn:hover, .theme-btn.active {
    color: var(--text-primary);
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  /* ── ANCIENT RASA GRAPHICS (THEME WATERMARKS) ── */
  body::before {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    width: 80vmin; height: 80vmin;
    margin-top: -40vmin; margin-left: -40vmin;
    pointer-events: none;
    z-index: -1;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    opacity: 0.05;
    transition: background-image 1.5s ease-in-out;
    mix-blend-mode: screen;
    animation: slowRotate 120s linear infinite;
  }
  @keyframes slowRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  body.theme-light::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 5 L55 30 L85 20 L60 45 L95 50 L60 55 L85 80 L55 70 L50 95 L45 70 L15 80 L40 55 L5 50 L40 45 L15 20 L45 30 Z" fill="none" stroke="%238b4513" stroke-width="0.5" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="25" fill="none" stroke="%238b4513" stroke-width="0.2" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="45" fill="none" stroke="%238b4513" stroke-width="0.2" opacity="0.4" stroke-dasharray="1 2"/%3E%3C/svg%3E');
    mix-blend-mode: multiply !important;
    opacity: 0.12 !important;
  }
  body.theme-fierce::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 5 L55 30 L85 20 L60 45 L95 50 L60 55 L85 80 L55 70 L50 95 L45 70 L15 80 L40 55 L5 50 L40 45 L15 20 L45 30 Z" fill="none" stroke="%23ff4d4d" stroke-width="0.5" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="25" fill="none" stroke="%23ff4d4d" stroke-width="0.2" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="45" fill="none" stroke="%23b52a2a" stroke-width="0.2" opacity="0.4" stroke-dasharray="1 2"/%3E%3C/svg%3E');
  }
  body.theme-earthy::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpath d="M50 10 Q65 40 50 50 Q35 40 50 10 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M50 90 Q65 60 50 50 Q35 60 50 90 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M10 50 Q40 65 50 50 Q40 35 10 50 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Cpath d="M90 50 Q60 65 50 50 Q60 35 90 50 Z" fill="none" stroke="%23c4892a" stroke-width="0.6" opacity="0.6"/%3E%3Ccircle cx="50" cy="50" r="30" fill="none" stroke="%23f0c040" stroke-width="0.3" opacity="0.5" stroke-dasharray="2 2"/%3E%3C/svg%3E');
  }
  body.theme-mystical::before {
    background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cpolygon points="50,10 90,75 10,75" fill="none" stroke="%234df5e2" stroke-width="0.5" opacity="0.6"/%3E%3Cpolygon points="50,90 90,25 10,25" fill="none" stroke="%234df5e2" stroke-width="0.5" opacity="0.6"/%3E%3Cpolygon points="50,20 80,70 20,70" fill="none" stroke="%232eb8a6" stroke-width="0.4" opacity="0.7"/%3E%3Cpolygon points="50,80 80,30 20,30" fill="none" stroke="%232eb8a6" stroke-width="0.4" opacity="0.7"/%3E%3Ccircle cx="50" cy="50" r="48" fill="none" stroke="%23176e62" stroke-width="0.3" opacity="0.5"/%3E%3Ccircle cx="50" cy="50" r="5" fill="%234df5e2" opacity="0.8"/%3E%3C/svg%3E');
  }

  body.custom-cursor-active,
  body.custom-cursor-active a,
  body.custom-cursor-active button,
  body.custom-cursor-active textarea,
  body.custom-cursor-active .tab,
  body.custom-cursor-active .course-card,
  body.custom-cursor-active .card-btn,
  body.custom-cursor-active .theme-btn {
    cursor: none !important;
  }
  .custom-cursor {
    position: fixed;
    top: 0; left: 0;
    width: 8px; height: 8px;
    background: var(--gold-bright);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000002;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, background 0.3s;
    box-shadow: 0 0 15px 3px var(--gold-bright);
  }
  .custom-cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 44px; height: 44px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000001;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease-out, width 0.3s, height 0.3s, border-color 0.3s;
    box-shadow: inset 0 0 10px var(--glow), 0 0 10px var(--glow);
  }
  .cursor-hover .custom-cursor {
    width: 60px;
    height: 60px;
    background: var(--glow);
    backdrop-filter: blur(4px);
    box-shadow: 0 0 20px var(--gold);
  }
  .cursor-hover .custom-cursor-ring {
    width: 80px;
    height: 80px;
    border-color: var(--gold-bright);
    border-style: dotted;
    border-width: 3px;
    animation: rotateRing 3s linear infinite;
  }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 0;
    transition: all 0.5s ease;
    overflow-x: hidden;
  }

  .glass-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-glass);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-brand {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size:1.2rem;
    color: var(--gold);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hero-intro {
    padding: 5rem 2rem 3rem;
    max-width: 1000px;
    margin: 0 auto;
    text-align: center;
  }
  .hero-title {
    font-family: 'Cinzel', serif;
    font-size:3.0rem;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .hero-subtitle {
    font-family: 'Outfit', sans-serif;
    font-size:1.2rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  .source-text-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    padding: 2rem;
    border-radius: 12px;
    text-align: left;
    margin-top: 2rem;
  }
  .source-text-title {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size:1.5rem;
    margin-bottom: 0.5rem;
  }
  .source-text-body {
    font-size:1.1rem;
    color: var(--text-primary);
    line-height: 1.8;
  }

  .tabs-container {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 4rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border-glass);
    padding-bottom: 1rem;
  }
  .tab {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size:1.1rem;
    padding: 0.5rem 1rem;
    transition: color 0.3s, border-bottom 0.3s;
    border-bottom: 2px solid transparent;
  }
  .tab.active, .tab:hover {
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
  }

  .content-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    max-width: 1200px;
    margin: 0 auto 5rem;
    padding: 0 2rem;
  }
  .course-card {
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 2rem;
    backdrop-filter: blur(10px);
    transition: transform 0.3s, border-color 0.3s;
  }
  .course-card:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
  }
  .card-title {
    font-family: 'Cinzel', serif;
    font-size:1.4rem;
    color: var(--gold);
    margin-bottom: 1rem;
  }
  .card-desc {
    font-size:0.95rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }
  .card-btn {
    display: inline-block;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--text-primary);
    padding: 0.6rem 1.2rem;
    border-radius: 20px;
    text-decoration: none;
    font-size:1.05rem;
    font-family: 'Outfit', sans-serif;
    transition: background 0.3s;
  }
  .card-btn:hover {
    background: var(--accent);
  }


  /* ── THEME GRAPHICS BG ── */
  .theme-graphics-bg {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: -2;
    overflow: hidden;
  }
  .graphic-element {
    position: absolute;
    opacity: 0;
    transition: opacity 1.2s ease-in-out, transform 1.5s ease-in-out;
    transform: scale(0.85) rotate(-10deg);
    color: var(--accent);
  }
  
  /* Specific Placements */
  .graphic-top-right {
    top: 8%;
    right: 5%;
    width: 25vw;
    height: 25vh;
  }
  .graphic-bottom-left {
    bottom: 8%;
    left: 4%;
    width: 25vw;
    height: 25vh;
  }

  /* Show active graphics based on theme class on body */
  body.theme-fierce .weapons-graphic {
    opacity: 0.08;
    transform: scale(1) rotate(0deg);
  }
  body.theme-earthy .manuscript-graphic {
    opacity: 0.09;
    transform: scale(1) rotate(5deg);
  }
  body.theme-mystical .yantra-graphic {
    opacity: 0.09;
    transform: scale(1) rotate(-5deg);
  }
  body.theme-light .royal-graphic {
    opacity: 0.07;
    transform: scale(1) rotate(0deg);
  }

  /* Side Graphic and Course Completion Styles */
  .hero-grid-layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 3rem;
    text-align: left;
    align-items: start;
    max-width: 1100px;
    margin: 0 auto;
  }
  .branch-graphic-container {
    position: sticky;
    top: 100px;
    text-align: center;
  }
  .branch-graphic-box {
    width: 100%;
    height: 280px;
    border-radius: 12px;
    overflow: hidden;
    border: 1.5px solid var(--border-glass);
    box-shadow: 0 0 30px var(--accent-glow);
    background: var(--bg-secondary);
  }
  .branch-graphic-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
  }
  .branch-graphic-label {
    font-family: 'Cinzel Decorative', serif;
    font-size:0.95rem;
    color: var(--text-muted);
    margin-top: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .completed-badge {
    color: var(--accent);
    font-size:0.95rem;
    font-family: 'Outfit';
    font-weight: 600;
    text-shadow: 0 0 10px var(--accent-glow);
    background: var(--accent-glow);
    border: 1px solid var(--border-glass);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .completed-card {
    border-color: var(--accent) !important;
    box-shadow: 0 0 15px var(--accent-glow);
  }

  @media (max-width: 860px) {
    .hero-grid-layout {
      grid-template-columns: 1fr !important;
      gap: 2rem !important;
    }
    .branch-graphic-container {
      display: none;
    }
  }
  @media (max-width: 768px) {
    .glass-nav {
      position: relative !important;
      padding: 0.75rem 1rem !important;
      flex-direction: column !important;
      gap: 0.75rem !important;
      align-items: center !important;
    }
    .glass-nav > div {
      flex-direction: row !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 10px !important;
      width: 100% !important;
      margin-left: 0 !important;
    }
    .theme-btn {
      padding: 4px 8px !important;
      font-size: 0.75rem !important;
    }
    .hero-intro {
      padding-top: 2rem !important;
    }
  }
</style>
</head>
<body class="theme-fierce">
<div class="theme-graphics-bg">
  <!-- FIERCE THEME: Crossed swords, trident, shield, bow -->
  <div class="graphic-element weapons-graphic graphic-top-right">
    <svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Shield -->
      <circle cx="100" cy="100" r="35" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="100" cy="100" r="28" stroke-dasharray="2 3"/>
      <!-- Shield Studs -->
      <circle cx="90" cy="90" r="2.5" fill="currentColor"/>
      <circle cx="110" cy="90" r="2.5" fill="currentColor"/>
      <circle cx="90" cy="110" r="2.5" fill="currentColor"/>
      <circle cx="110" cy="110" r="2.5" fill="currentColor"/>
      <!-- Crossed Swords (Talwars) -->
      <!-- Sword 1 (top-left to bottom-right) -->
      <path d="M40 40 L160 160" />
      <path d="M160 160 Q163 163 160 165 Q157 167 155 165 Z" fill="currentColor"/> <!-- Hilt -->
      <path d="M40 40 Q25 45 42 58" /> <!-- Curve blade -->
      <path d="M48 48 L142 142" stroke-dasharray="1 3"/>
      <!-- Sword 2 (top-right to bottom-left) -->
      <path d="M160 40 L40 160" />
      <path d="M40 160 Q37 163 40 165 Q43 167 45 165 Z" fill="currentColor"/>
      <path d="M160 40 Q175 45 158 58" />
      <path d="M152 48 L58 142" stroke-dasharray="1 3"/>
      <!-- Trident (Trishula) -->
      <path d="M100 100 L100 25" stroke-width="2"/>
      <path d="M85 40 Q100 55 100 25" />
      <path d="M115 40 Q100 55 100 25" />
      <path d="M92 48 Q100 45 108 48" />
      <!-- Bow (Dhanush) -->
      <path d="M50 120 Q100 175 150 120" stroke-width="2"/>
      <path d="M50 120 L150 120" stroke-dasharray="2 4" /> <!-- String -->
    </svg>
  </div>
  <div class="graphic-element weapons-graphic graphic-bottom-left">
    <svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="100" cy="100" r="30"/>
      <path d="M30 30 L170 170" />
      <path d="M170 30 L30 170" />
      <path d="M100 10 L100 190" stroke-width="2"/>
      <path d="M80 60 Q100 85 100 10" />
      <path d="M120 60 Q100 85 100 10" />
    </svg>
  </div>

  <!-- EARTHY THEME: Flying palm-leaf manuscripts, scripts, leaves -->
  <div class="graphic-element manuscript-graphic graphic-top-right">
    <svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Palm leaf 1 -->
      <g transform="rotate(15 100 100)">
        <rect x="30" y="70" width="140" height="25" rx="3" stroke="currentColor" stroke-width="2"/>
        <line x1="40" y1="77" x2="160" y2="77" stroke-dasharray="4 2"/>
        <line x1="40" y1="83" x2="160" y2="83" stroke-dasharray="3 3"/>
        <line x1="40" y1="89" x2="160" y2="89" stroke-dasharray="5 2"/>
        <circle cx="100" cy="82.5" r="3" fill="currentColor"/> <!-- Binding Hole -->
      </g>
      <!-- Palm leaf 2 (behind, rotated) -->
      <g transform="rotate(-10 100 100) translate(0 -30)">
        <rect x="40" y="80" width="120" height="22" rx="3" opacity="0.6"/>
        <circle cx="100" cy="91" r="2.5" fill="currentColor" opacity="0.6"/>
      </g>
      <!-- Peacock Feather / Quill -->
      <path d="M140 30 Q110 50 80 120" stroke-width="2"/>
      <path d="M140 30 Q150 40 135 50 Q110 70 88 120" opacity="0.7"/>
      <path d="M120 40 L130 35" />
      <path d="M110 50 L120 45" />
      <path d="M100 60 L110 55" />
      <path d="M90 75 L100 70" />
      <path d="M80 90 L90 85" />
      <!-- Swirling wind paths -->
      <path d="M20 50 Q50 20 80 40 T150 20" stroke-dasharray="1 4" opacity="0.5"/>
      <path d="M40 150 Q90 120 140 160" stroke-dasharray="1 4" opacity="0.5"/>
    </svg>
  </div>
  <div class="graphic-element manuscript-graphic graphic-bottom-left">
    <svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(-25 100 100)">
        <rect x="30" y="80" width="140" height="25" rx="3"/>
        <line x1="45" y1="87" x2="155" y2="87" stroke-dasharray="3 2"/>
        <line x1="45" y1="93" x2="155" y2="93" stroke-dasharray="4 3"/>
        <circle cx="100" cy="92.5" r="3" fill="currentColor"/>
      </g>
      <path d="M120 60 Q105 80 90 140" stroke-width="1.5"/>
      <path d="M105 70 L115 65" />
      <path d="M98 85 L108 80" />
      <path d="M92 100 L102 95" />
    </svg>
  </div>

  <!-- MYSTICAL THEME: Sri Chakra, Yantra, sacred geometry, ripples -->
  <div class="graphic-element yantra-graphic graphic-top-right">
    <svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.2">
      <!-- Outer Square (Bhupura) -->
      <rect x="25" y="25" width="150" height="150" stroke-width="1.5"/>
      <path d="M90 25 L90 15 M110 25 L110 15 M25 90 L15 90 M25 110 L15 110 M90 175 L90 185 M110 175 L110 185 M175 90 L185 90 M175 110 L185 110" />
      <!-- Concentric Circles -->
      <circle cx="100" cy="100" r="65" />
      <circle cx="100" cy="100" r="55" stroke-dasharray="1 3"/>
      <!-- Intersecting Triangles (Yantra Core) -->
      <!-- Facing Up -->
      <polygon points="100,55 145,130 55,130" />
      <polygon points="100,70 135,123 65,123" />
      <!-- Facing Down -->
      <polygon points="100,145 145,70 55,70" />

// Render dynamic content
function renderPage() {
  // Update browser tab title
  document.title = activeData.title.split(':')[0] + "Hub — Era of Siddhas";

  // Update Hero Section
  const heroSection = document.getElementById('hero-section');
  let sourceTextsHTML = activeData.sourceTexts.map(st => `
    <strong>${st.title}</strong><br>
    <em>Composed: ${st.composed}</em><br>
    ${st.description}<br><br>
  `).join('');
  
  // Remove trailing <br><br>
  sourceTextsHTML = sourceTextsHTML.slice(0, -8);

  let branchImg = 'ancient_weapons.png';
  if (currentPillar === 'rājya') branchImg = 'flying_manuscript.png';
  if (currentPillar === 'nagara') branchImg = 'sacred_city.png';

  heroSection.innerHTML = `
    <div class="hero-grid-layout">
      <div>
        <h1 class="hero-title" style="text-align: left; margin-top: 0;">${activeData.title}</h1>
        <p class="hero-subtitle" style="text-align: left; margin-bottom: 1.5rem;">${activeData.subtitle}</p>
        <div class="source-text-card">
          <div class="source-text-title">Primary Source Texts</div>
          <div class="source-text-body">
            ${sourceTextsHTML}
          </div>
        </div>
      </div>
      <div class="branch-graphic-container">
        <div class="branch-graphic-box">
          <img src="${branchImg}" alt="${currentPillar} symbol" class="branch-graphic-img">
        </div>
        <div class="branch-graphic-label">
          ${currentPillar.toUpperCase()} PILLAR SYMBOL
        </div>
      </div>
    </div>
  `;

  // Update Tabs
  const tabsSection = document.getElementById('tabs-section');
  tabsSection.innerHTML = `
    <button class="tab active" onclick="switchTab(this, 'learn')">Learn (Sub-topics)</button>
    <button class="tab" onclick="switchTab(this, 'stories')">Stories</button>
    <button class="tab" onclick="switchTab(this, 'games')">Games & Quiz</button>
    <button class="tab" onclick="switchTab(this, 'simulations')">Simulations</button>
    <button class="tab" onclick="switchTab(this, 'nano')">Nano Courses</button>
  `;

  // Update Inner Sanctum nav button href to pass the current pillar
  const sanctumNavBtn = document.querySelector('.nav-btn[href^="sanctum.html"]');
  if (sanctumNavBtn) {
    sanctumNavBtn.href = `sanctum.html?pillar=${currentPillar}`;
  }

  // Render Learn tab content by default
  renderTabContent('learn');
}

function switchTab(btn, tabKey) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderTabContent(tabKey);
}

function renderTabContent(tabKey) {
  const courseGrid = document.getElementById('course-grid');
  const cards = activeData.tabs[tabKey] || [];
  
  if (cards.length === 0) {
    courseGrid.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
        <p>This path is currently sealed. Focus your mind on other gates.</p>
      </div>
    `;
    return;
  }

  const completed = JSON.parse(localStorage.getItem('era_of_siddhas_completed') || '{}');
  const completedPillar = completed[currentPillar] || [];

  courseGrid.innerHTML = cards.map(card => {
    let isCompleted = false;
    if (card.actionLink.includes('course=')) {
      const match = card.actionLink.match(/course=([^&]+)/);
      if (match && completedPillar.includes(match[1])) {
        isCompleted = true;
      }
    } else if (card.actionLink.includes('chanting.html') && completedPillar.includes('chanting')) {
      isCompleted = true;
    } else if (card.actionLink.includes('sanctum.html') && completedPillar.includes('sanctum')) {
      isCompleted = true;
    }

    const checkmark = isCompleted ? `<span class="completed-badge">✓ Completed</span>` : '';

    return `
      <a href="${card.actionLink}" class="course-card ${isCompleted ? 'completed-card' : ''}" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <div class="card-title" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <span>${card.title}</span>
            ${checkmark}
          </div>
          <div class="card-desc">${card.desc}</div>
        </div>
        <div style="margin-top: 1.5rem;">
          <span class="card-btn" style="display: inline-block; ${isCompleted ? 'background: var(--gold-dim); border-color: var(--accent);' : ''}">${isCompleted ? 'Review Lesson' : card.actionText}</span>
        </div>
      </a>
    `;
  }).join('');

  // Intercept hash card clicks for the immersive reader
  bindCardClicks();

  // Re-bind cursor hover listeners
  bindCursorEvents();
}

// Custom Cursor Logic
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mouseX = 0, mouseY = 0;
let ringX = 0, ringY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
});

function animateRing() {
  ringX += (mouseX - ringX) * 0.2;
  ringY += (mouseY - ringY) * 0.2;
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top = ringY + 'px';
  requestAnimationFrame(animateRing);
}

if (cursor && cursorRing) {
  document.body.classList.add('custom-cursor-active');
  animateRing();
}

function bindCursorEvents() {
  document.querySelectorAll('a, button, .tab, .course-card, .theme-btn, .action-btn').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
  });
}

// Theme Management with Persistence
function setTheme(btnElement, themeName) {
  document.body.classList.remove('theme-fierce', 'theme-earthy', 'theme-mystical', 'theme-light');
  document.body.classList.add(themeName);
  localStorage.setItem('era_of_siddhas_theme', themeName);
  document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
  if (btnElement) {
    btnElement.classList.add('active');
  } else {
    document.querySelectorAll('.theme-btn').forEach(btn => {
      if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(themeName)) {
        btn.classList.add('active');
      }
    });
  }
}

// Initialization on Load
document.addEventListener('DOMContentLoaded', async () => {
  // Fetch custom content first
  if (window.EOS_API && typeof window.EOS_API.getAllCustomContent === 'function') {
    const customContent = await window.EOS_API.getAllCustomContent();
    if (customContent) {
      // 1. Process custom stories
      if (customContent.stories) {
        customContent.stories.forEach(story => {
          const p = story.pillar;
          if (pillarData[p]) {
            if (!pillarData[p].tabs.stories) {
              pillarData[p].tabs.stories = [];
            }
            pillarData[p].tabs.stories.push({
              title: story.title,
              desc: story.desc,
              actionText: "Read Story",
              actionLink: `#story-dynamic-${story.id}`
            });
            // Map story content in readerContentData
            const pillarLabels = { nagara: "Nagara Nirmana", rājya: "Rājya Palanam", yuddham: "Yuddham" };
            const label = pillarLabels[p] || p.toUpperCase();
            readerContentData[`story-dynamic-${story.id}`] = {
              category: `${label} — Custom Story`,
              title: story.title,
              content: story.content
            };
          }
        });
      }
      
      // 2. Process custom activities
      if (customContent.activities) {
        customContent.activities.forEach(act => {
          const p = act.pillar;
          if (pillarData[p]) {
            if (!pillarData[p].tabs.games) {
              pillarData[p].tabs.games = [];
            }
            pillarData[p].tabs.games.push({
              title: act.title,
              desc: act.desc,
              actionText: "Play Challenge",
              actionLink: act.action_link
            });
          }
        });
      }

      // 3. Process custom simulations
      if (customContent.simulations) {
        customContent.simulations.forEach(sim => {
          const p = sim.pillar;
          if (pillarData[p]) {
            if (!pillarData[p].tabs.simulations) {
              pillarData[p].tabs.simulations = [];
            }
            pillarData[p].tabs.simulations.push({
              title: sim.title,
              desc: sim.desc,
              actionText: "Run Simulation",
              actionLink: sim.action_link
            });
          }
        });
      }
    }
  }

  // Ensure every pillar has simulations array so rendering doesn't break
  Object.keys(pillarData).forEach(p => {
    if (!pillarData[p].tabs.simulations) {
      pillarData[p].tabs.simulations = [];
    }
  });

  renderPage();
  const initialTheme = localStorage.getItem('era_of_siddhas_theme') || 'theme-light';
  setTheme(null, initialTheme);
});

// Immersive Reader Modal Functions and Database
function openReaderModal(key) {
  const data = readerContentData[key];
  if (!data) return;

  document.getElementById('reader-category').innerText = data.category;
  document.getElementById('reader-title').innerText = data.title;
  document.getElementById('reader-content').innerHTML = data.content;
  document.getElementById('reader-modal').style.display = 'flex';
  
  bindCursorEvents();
}

function closeReaderModal() {
  document.getElementById('reader-modal').style.display = 'none';
}

function bindCardClicks() {
  document.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', (e) => {
      const href = card.getAttribute('href');
      if (href && (href.startsWith('#story-') || href.startsWith('#nano-'))) {
        e.preventDefault();
        openReaderModal(href.substring(1));
      }
    });
  });
}
