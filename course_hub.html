// Get the pillar from the URL query parameter (defaults to yuddham)
const urlParams = new URLSearchParams(window.location.search);
const currentPillar = urlParams.get('pillar') || 'yuddham';
const activeData = pillarData[currentPillar] || pillarData.yuddham;

// Render dynamic content
function renderPage() {
  // Update browser tab title
  document.title = activeData.title.split(':')[0] + "Hub — Era of Siddhas";

  // Update Hero Section
  const heroSection = document.getElementById('hero-section');
  let sourceTextsHTML = activeData.sourceTexts.map(st => `
    <strong>${st.title}</strong><br>
    <em>Composed: ${st.composed}</em><br>
    ${st.description}<br><br>
  `).join('');
  
  // Remove trailing <br><br>
  sourceTextsHTML = sourceTextsHTML.slice(0, -8);

  heroSection.innerHTML = `
    <h1 class="hero-title">${activeData.title}</h1>
    <p class="hero-subtitle">${activeData.subtitle}</p>

    <div class="source-text-card">
      <div class="source-text-title">Primary Source Texts</div>
      <div class="source-text-body">
        ${sourceTextsHTML}
      </div>
    </div>
  `;

  // Update Tabs
  const tabsSection = document.getElementById('tabs-section');
  tabsSection.innerHTML = `
    <button class="tab active" onclick="switchTab(this, 'learn')">Learn (Sub-topics)</button>
    <button class="tab" onclick="switchTab(this, 'stories')">Stories</button>
    <button class="tab" onclick="switchTab(this, 'games')">Games & Quiz</button>
    <button class="tab" onclick="switchTab(this, 'nano')">Nano Courses</button>
  `;

  // Render Learn tab content by default
  renderTabContent('learn');
}

function switchTab(btn, tabKey) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderTabContent(tabKey);
}

function renderTabContent(tabKey) {
  const courseGrid = document.getElementById('course-grid');
  const cards = activeData.tabs[tabKey] || [];
  
  if (cards.length === 0) {
    courseGrid.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
        <p>This path is currently sealed. Focus your mind on other gates.</p>
      </div>
    `;
    return;
  }

  courseGrid.innerHTML = cards.map(card => `
    <a href="${card.actionLink}" class="course-card" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <div class="card-title">${card.title}</div>
        <div class="card-desc">${card.desc}</div>
      </div>
      <div style="margin-top: 1.5rem;">
        <span class="card-btn" style="display: inline-block;">${card.actionText}</span>
      </div>
    </a>
  `).join('');

  // Intercept hash card clicks for the immersive reader
  bindCardClicks();

  // Re-bind cursor hover listeners
  bindCursorEvents();
}

// Custom Cursor Logic
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mouseX = 0, mouseY = 0;
let ringX = 0, ringY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
});

function animateRing() {
  ringX += (mouseX - ringX) * 0.2;
  ringY += (mouseY - ringY) * 0.2;
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top = ringY + 'px';
  requestAnimationFrame(animateRing);
}

if (cursor && cursorRing) {
  document.body.classList.add('custom-cursor-active');
  animateRing();
}

function bindCursorEvents() {
  document.querySelectorAll('a, button, .tab, .course-card, .theme-btn, .action-btn').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
  });
}

// Theme Management with Persistence
function setTheme(btnElement, themeName) {
  document.body.classList.remove('theme-fierce', 'theme-earthy', 'theme-mystical');
  document.body.classList.add(themeName);
  localStorage.setItem('era_of_siddhas_theme', themeName);
  document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
  if (btnElement) {
    btnElement.classList.add('active');
  } else {
    document.querySelectorAll('.theme-btn').forEach(btn => {
      if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(themeName)) {
        btn.classList.add('active');
      }
    });
  }
}

// Initialization on Load
document.addEventListener('DOMContentLoaded', () => {
  renderPage();
  const initialTheme = localStorage.getItem('era_of_siddhas_theme') || 'theme-fierce';
  setTheme(null, initialTheme);
});

// Immersive Reader Modal Functions and Database
function openReaderModal(key) {
  const data = readerContentData[key];
  if (!data) return;

  document.getElementById('reader-category').innerText = data.category;
  document.getElementById('reader-title').innerText = data.title;
  document.getElementById('reader-content').innerHTML = data.content;
  document.getElementById('reader-modal').style.display = 'flex';
  
  bindCursorEvents();
}

function closeReaderModal() {
  document.getElementById('reader-modal').style.display = 'none';
}

function bindCardClicks() {
  document.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', (e) => {
      const href = card.getAttribute('href');
      if (href && (href.startsWith('#story-') || href.startsWith('#nano-'))) {
        e.preventDefault();
        openReaderModal(href.substring(1));
      }
    });
  });
}

  <div style="background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: 28px; padding: 3rem; width: 90%; max-width: 800px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 1.5rem; position: relative;">
    <button onclick="closeReaderModal()" style="position: absolute; top: 1.5rem; right: 1.5rem; background: transparent; border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: 50%; width: 40px; height: 40px; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center;" class="action-btn">×</button>
    <div id="reader-header" style="border-bottom: 1px solid var(--border-glass); padding-bottom: 1rem;">
      <div id="reader-category" style="font-family: 'Outfit', sans-serif; font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem;">CATEGORY</div>
      <h2 id="reader-title" style="font-family: 'Cinzel', serif; color: var(--text-primary); margin: 0; font-size: 2rem;">Topic Title</h2>
    </div>
    <div id="reader-content" style="max-height: 450px; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; font-family: 'EB Garamond', Georgia, serif; font-size: 1.15rem; line-height: 1.8; color: var(--text-primary); padding-right: 0.8rem;">
      <!-- Content will be injected here -->
    </div>
  </div>
</div>
</body>
</html>
