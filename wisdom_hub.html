<script>
  let allArticles = [];
  let activeFilter = 'all';

  async function loadArticles() {
    if (window.EOS_API && typeof window.EOS_API.getPublicArticles === 'function') {
      allArticles = await window.EOS_API.getPublicArticles();
    } else {
      // Mock data for offline or demo run
      allArticles = [
        {
          id: 5,
          category: 'research',
          title: 'The Atharvaveda of City Planning: Prana, Protection, and the Blueprint of Madurai',
          author: 'Siddha Council',
          summary: 'Explore how the Atharvaveda provides the spiritual prana (life force) and energetic shield for sacred city planning, working in tandem with the Mayamatam and Agamas.',
          content: '<h3>The Energetic Soul of Nagara Nirmana</h3><p>While the Shilpa Shastras (like the <i>Manasara</i>) and the Agamas provide the structural and geometric blueprint (the physical anatomy and measurements), the <b>Atharvaveda</b> provides the <i>prana</i> (life force), the ritual execution, and the protective wisdom required to make that physical structure actually \"alive\" and divine. Without the energetic rituals of the Atharvaveda, a city built using only the Agamas would just be a mathematically perfect, but ultimately \"dead\" pile of stones.</p><h3>The Wisdom (The Knowing): Earth as a Living Organism</h3><p>The Atharvaveda (housing the Sthapatya Veda) teaches that land is not dead dirt, but a living, breathing organism with energy meridians (Nad\u012bs), similar to the human body. It gives the wisdom to identify the <i>marma sthanas</i> (vital energy points) of a geographical site so that the central temple (Brahmasthana) can be placed exactly on the earth\'s spiritual nerve center. Furthermore, by balancing the five elements (Pancha Bhoota) in the physical geography of the city, it prevents societal decay, poverty, and discord. Deep philosophical hymns are dedicated to <b>Vastospati</b> (the deity of physical spaces), showing that a city is a shared dwelling for humans, nature, and divine forces.</p><h3>The Execution (The Doing): Shielding and Hydrology</h3><p>The Atharvaveda guides the practical execution of consecration and protection. Before building, the land must be pacified and healed using specific purification rituals (Bhoomi Pujan and Vastu Shanti), utilizing hymns like <b>Book 3, Hymn 12</b> to invoke the creator Tvastar for foundation-raising. Border protection is established through <i>Nagara Raksha</i>, utilizing Rakshoghna and Krivinashana hymns to project energetic shields at the outer walls and the four cardinal gates. Water hydrology, invoking the rain deity Parjanya, guides the digging of temple tanks (like the Potramarai Kulam in Madurai) and river alignments to ensure prosperity. Class zoning is structured under Atharvanic principles of statecraft to maintain social harmony.</p><h3>The limits & Hand-off: The Anesthetic vs the Scalpel</h3><p>To understand the Atharvaveda\'s effectiveness, one must also recognize its limits. It will not detail the exact width of streets, the proportions of Gopurams, or which stone to carve. For these structural measurements, it hands off to the Agamas (Kamikagama) and Shilpa Shastras (Mayamatam). Thus, the Atharvaveda behaves like the <b>anesthetic, life-support, and blessing</b> (spiritual execution) to the <b>scalpel and anatomical charts</b> (structural execution) of the Shastras. Both are mandatory to construct a living temple city.</p>',
          image_url: 'flying_manuscript.png',
          created_at: '2026-06-04T00:00:00'
        },
        {
          id: 4,
          category: 'research',
          title: 'The Sacred Geometry of Nagara Nirmana: How the Divine Reality is Built',
          author: 'Siddha Council',
          summary: 'A deep dive into the Vastu Purusha Mandala, the 9x9 Paramasayika grid, and the living lotus geometry of Madurai Sthalam.',
          content: '<h3>The Texts of Nagara Nirmana</h3><p>The layout and development of divine settlements in India are codified in the Shilpa Shastras (such as the <i>Manasara</i>, <i>Mayamatam</i>, <i>Samarangana Sutradhara</i>, and <i>Aparajita Priccha</i>), the Samhitas and Puranas (like Varahamihira\'s <i>Brihat Samhita</i> and the <i>Vishnudharmottara Purana</i>), and the Agamas (including the <i>Kamikagama</i>). These texts dictate that the physical environment directly governs human consciousness, mandating that the city structure must serve as a living reflection (pratikriti) of the cosmos.</p><h3>The Blueprint of the Vastu Purusha Mandala</h3><p>For a major city, a 9x9 grid of 81 squares, known as the <b>Paramasayika Mandala</b>, is drawn on the earth. At the absolute center sits the <b>Brahmasthana</b>\u2014the seat of the Creator. Reserved exclusively for the temple, no mortal is allowed to reside here, establishing the Divine as the city\'s spiritual anchor. The city spreads outward in concentric rectangular layers (Prakaras) representing the descending sheaths of spirit into matter: the Inner Ring (Sattvic: scholars and ascetics), the Middle Ring (Rajasic: rulers and merchants), the Outer Ring (Tamasic: labor and agriculture), and the Periphery far outside (polluting industries like tanneries, ensuring the center\'s purity).</p><h3>Madurai: The Living Lotus City</h3><p>Madurai stands as the ultimate living embodiment of the Mayamatam and Agamic layout. Known in the shastras as a <b>Padma Vana</b> (Lotus Forest) or Kudal, the city represents the petals of a lotus radiating from the central Meenakshi Sundareswarar Temple. Shiva (Sundareswarar) represents pure, formless consciousness, and Shakti (Meenakshi) represents dynamic energy. The concentric streets are named after the Tamil months: Chitrai, Aavani Moola, Masi, and Aadi Veedhi. Because these streets wrap around the temple, every daily activity performs circumambulation (Pradakshina) of God. The Vaigai River and Potramarai Kulam (Golden Lotus Tank) provide physical and spiritual purification, making Madurai the flawless synthesis of civic life and sacred geometry.</p>',

  function renderArticles() {
    const grid = document.getElementById('articlesGrid');
    grid.innerHTML = '';

    const filtered = allArticles.filter(art => activeFilter === 'all' || art.category === activeFilter);

    if (filtered.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">
        <p>No publications are found under this gate. More wisdom is compiling in the archives.</p>
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(art => {
      const categoryLabels = {
        magazine: 'Magazine',
        article: 'Weekly Article',
        blog: 'Blog',
        research: 'Modern Research',
        story: 'Itihasa & Purana'
      };
      const label = categoryLabels[art.category] || art.category.toUpperCase();
      const date = new Date(art.created_at).toLocaleDateString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric'
      });
      const fallbackImage = art.category === 'research' ? 'sacred_city.png' :
                            art.category === 'story' ? 'ancient_weapons.png' : 'flying_manuscript.png';
      const img = art.image_url || fallbackImage;

      return `
        <a href="#" class="article-card" onclick="openArticle(${art.id}, event)">
          <div class="card-img-box">
            <img src="${img}" alt="${art.title}" class="card-img">
            <span class="card-badge">${label}</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${art.title}</h3>
            <p class="card-summary">${art.summary}</p>
            <div class="card-footer">
              <span class="card-author">By ${art.author}</span>
              <span>${date}</span>
            </div>
          </div>
        </a>
      `;
    }).join('');

    bindCursorEvents();
  }

  function switchFilter(btn, filterKey) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = filterKey;
    renderArticles();
  }

  function openArticle(id, event) {
    event.preventDefault();
    const art = allArticles.find(a => a.id === id);
    if (!art) return;

    const categoryLabels = {
      magazine: 'Magazine Edition',
      article: 'Weekly Article',
      blog: 'Blog Post',
      research: 'Modern Research Validation',
      story: 'Itihasa & Purana Story'
    };

    document.getElementById('reader-category').innerText = categoryLabels[art.category] || art.category.toUpperCase();
    document.getElementById('reader-title').innerText = art.title;
    document.getElementById('reader-meta').innerText = `By ${art.author} · Published on ${new Date(art.created_at).toLocaleDateString('en-IN')}`;
    document.getElementById('reader-content').innerHTML = art.content;
    document.getElementById('reader-modal').style.display = 'flex';
    bindCursorEvents();
  }

  function closeReader() {
    document.getElementById('reader-modal').style.display = 'none';
  }

  // Custom Cursor Logic
  const cursor = document.getElementById('cursor');
  const cursorRing = document.getElementById('cursor-ring');

  document.addEventListener('mousemove', (e) => {
    if (cursor) {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    }
    if (cursorRing) {
      cursorRing.style.left = e.clientX + 'px';
      cursorRing.style.top = e.clientY + 'px';
    }
  });

  if (cursor && cursorRing) {
    document.body.classList.add('custom-cursor-active');
  }

  function bindCursorEvents() {
    document.querySelectorAll('a, button, .tab, .article-card, .theme-btn, .reader-close').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });
  }

  // Theme Management
  function setTheme(btnElement, themeName) {
    document.body.classList.remove('theme-fierce', 'theme-earthy', 'theme-mystical', 'theme-light');
    document.body.classList.add(themeName);
    localStorage.setItem('era_of_siddhas_theme', themeName);
    document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
    if (btnElement) {
      btnElement.classList.add('active');
    } else {
      document.querySelectorAll('.theme-btn').forEach(btn => {
        if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(themeName)) {
          btn.classList.add('active');
        }
      });
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadArticles();
    const initialTheme = localStorage.getItem('era_of_siddhas_theme') || 'theme-light';
    setTheme(null, initialTheme);
  });
</script>
